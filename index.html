<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141311">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Học sáo">
<title>Học nhạc lý — nốt và đập chân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141311;
    --ink: #ece8e1;
    --soft: #a39b90;
    --line: #3a3732;
    --card: #1e1d1a;
    --raise: #2a2824;
    --paper: #f4f0e6;
    --accent: #e0a04a;
    --accent-ink: #f0c98a;
    --on-accent: #1a140c;
    --nhac: #6aa8c4;
    --nhac-ink: #b7d6e6;
    --good: #3dbe74;
    --good-bg: #163226;
    --bad: #e06a5c;
    --bad-bg: #3a221e;
    --shadow: 0 0 0 1px rgba(255, 255, 255, .03);
    --serif: "Be Vietnam Pro", "Segoe UI", sans-serif;
    --sans: "Be Vietnam Pro", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; max-width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--bg);
    line-height: 1.45;
    height: 100%;
  }
  button, input, select { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type="checkbox"] { accent-color: var(--accent); }
  select { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .wrap {
    width: min(1180px, 100%); max-width: 1180px; height: 100%;
    margin: 0 auto; padding: 8px 14px 10px;
    display: flex; flex-direction: column; min-height: 0;
  }
  h1 {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 15px;
    line-height: 1;
    margin: 0;
    letter-spacing: .04em;
  }
  .topbar {
    display: flex; flex-wrap: nowrap; gap: 10px 14px;
    align-items: center; justify-content: space-between;
    margin: 0 0 8px; padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; gap: 2px; border-bottom: none; flex: 1; min-width: 0; }
  .tabs button {
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 6px 8px 8px; margin-bottom: 0;
    font-weight: 650; color: var(--soft); font-size: 13px;
    border-radius: 0;
  }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tempo { display: flex; flex-direction: column; gap: 2px; min-width: 132px; flex: none; }
  .tempo span { font-size: 12px; color: var(--soft); font-weight: 600; }
  .tempo strong { color: var(--ink); }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .switches { display: flex; flex-wrap: nowrap; gap: 8px 10px; margin: 0; flex: none; }
  #app { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  #app > .note-layout,
  #app > .sheet,
  #app > .practice-fit,
  #app > .breath-fit { flex: 1; min-height: 0; }
  .note-layout { height: 100%; overflow: hidden; }
  .note-main { min-height: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .note-staff { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .note-staff .score-scroll, .fit-score { flex: 1; min-height: 0; overflow: hidden; }
  .note-staff .score-scroll svg.staff { max-height: none; }
  .note-staff .foot-note { flex: none; margin: 4px 0 0; font-size: 12px; }
  .detail { flex: none; }
  .sheet { display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .sheet .now { min-height: 0; }
  .sheet .now strong { font-size: 22px; }
  .sheet .footwrap { height: 40px; }
  .sheet .foot svg { width: 84px; height: auto; }
  .sheet .lamps { margin-top: 2px; gap: 4px; }
  .sheet .lamps i { padding: 2px 1px; font-size: 11px; }
  .sheet .rhythm-top { flex: 1.15; min-height: 0; align-items: stretch; }
  .sheet .row { margin-top: 4px; }
  .sheet .demo-card { min-height: 0; display: flex; flex-direction: column; }
  .sheet .demo-card .score-scroll { flex: 1; min-height: 0; height: auto; overflow: hidden; }
  .sheet .finger-picks { margin-top: 4px; }
  .sheet .finger-picks .btn { padding: 4px 8px; font-size: 12px; }
  .sheet-rest .piece p { margin: 0; font-size: 12px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .sheet .demo-card .score-scroll svg { width: auto; height: auto; max-width: none; }
  .sheet .demo-card > p { display: none; }
  .sheet .rgrid { margin-top: 0; gap: 6px; grid-template-columns: repeat(6, minmax(0, 1fr)); min-width: 0; }
  .sheet .rcard { min-width: 0; padding: 6px 8px; }
  .sheet .rcard strong, .sheet .rcard em { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-rest { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .sheet-rest .finger-card { flex: none; }
  .sheet-rest .piece { flex: 1; min-height: 0; overflow: hidden; }
  .sheet-rest .piece .score-scroll { flex: 1; min-height: 0; overflow: hidden; }
  .practice-fit { display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .practice-fit > .card { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .practice-fit .score-scroll { flex: 1; min-height: 0; overflow: hidden; }
  .practice-fit > .card .score-scroll { flex: 0 1 auto; max-height: 340px; min-height: 0; overflow: hidden; align-items: center; justify-content: flex-start; }
  .practice-fit > .card .score-scroll svg.staff { max-height: none; width: auto; height: auto; }
  .practice-fit > .card .choices { overflow: hidden; min-height: 0; flex: 1 1 auto; }
  .practice-fit > .tap-layout { flex: 1; min-height: 0; height: auto; overflow: hidden; }
  .practice-fit .tap-layout > .card { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .practice-fit .tap-layout .score-scroll { flex: 1; min-height: 0; overflow: hidden; }
  .switches label {
    display: flex; gap: 6px; align-items: center;
    font-size: 12px; font-weight: 600; color: var(--soft); white-space: nowrap;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: none;
    padding: 10px 12px;
  }
  #app, .card, .piece, .pieces { min-width: 0; max-width: 100%; }
  .note-layout, .rhythm-top, .tap-layout, .read-layout {
    display: grid; gap: 16px; align-items: start;
    min-width: 0; max-width: 100%;
  }
  .note-layout { grid-template-columns: minmax(0, 1fr) minmax(240px, 320px); grid-template-rows: minmax(0, 1fr) auto; align-items: stretch; }
  .note-main { display: contents; }
  .note-staff { grid-column: 1; grid-row: 1 / span 2; }
  .note-layout > .ladder { grid-column: 2; grid-row: 1; overflow: hidden; }
  .detail { grid-column: 2; grid-row: 2; overflow: visible; }
  .rhythm-top { grid-template-columns: 260px minmax(0, 1fr); }
  .tap-layout { grid-template-columns: 1.35fr .8fr; }
  .note-main, .note-layout > .ladder { height: 100%; min-height: 0; }
  .note-layout > .ladder { overflow: auto; }
  .practice-fit > .tap-layout { align-items: stretch; }
  .sheet-rest .pieces { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .sheet .piece-tabs { margin: 4px 0; }
  .sheet .foot-note { margin: 0; font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sheet .pane-tabs { flex: none; margin: 0; }
  .sheet .piece-tabs .btn { padding: 5px 10px; font-size: 13px; white-space: nowrap; }
  .sheet .nums { flex-wrap: nowrap; overflow-x: auto; }
  .sheet > .nhip-pane { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 6px; }
  .sheet > .lo-pane { flex: 1; min-height: 0; overflow: auto; }
  .sheet .piece-blurb { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .line-switch { display: flex; flex-wrap: wrap; gap: 6px; flex: none; }
  .line-switch .btn { padding: 4px 8px; font-size: 12px; }
  .score-scroll { overflow: hidden; max-width: 100%; min-width: 0; padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: var(--paper); border-radius: 6px; }
  .score-scroll svg.staff { width: auto; height: auto; max-width: none; flex: none; display: block; }
  .score-scroll svg.staff[hidden] { display: none; }
  .ladder { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); grid-auto-columns: minmax(0, 1fr); gap: 4px; align-content: start; }
  .ladder-btn {
    display: flex; gap: 6px; align-items: center; width: 100%; min-width: 0;
    text-align: left; background: transparent; border: 1px solid transparent;
    border-radius: 6px; padding: 4px 6px;
  }
  .ladder-btn.on { background: var(--raise); border-color: var(--accent); box-shadow: none; }
  .ladder-btn strong { display: block; font-size: 14px; }
  .ladder-btn small { display: block; color: var(--soft); font-weight: 600; font-size: 11px; line-height: 1.2; }
  .ladder-btn .sure { margin-left: auto; font-style: normal; font-size: 11px; font-weight: 700; color: var(--good); }
  .ladder-btn .swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .mini i { position: absolute; left: 0; right: 0; height: 1.5px; background: currentColor; opacity: .4; }
  .mini i.ledger { left: 7px; right: 7px; opacity: .75; }
  .mini b {
    position: absolute; left: 6px; width: 10px; height: 7px; margin-top: -3px;
    border-radius: 50%; background: var(--c, var(--ink)); transform: rotate(-18deg);
  }
  .detail h2 { font-family: var(--sans); font-weight: 700; font-size: 26px; margin: 0 0 4px; }
  .detail .aka { color: var(--soft); font-weight: 600; }
  .detail .where { font-weight: 700; color: var(--accent-ink); margin: 8px 0; }
  .mnemonic { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .mnemonic p { margin: 0; }
  .mnemonic b.hit { color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn {
    border: 1px solid var(--line); background: var(--raise); color: var(--ink); border-radius: 6px;
    padding: 8px 12px; font-weight: 700; font-size: 14px;
  }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn.on { border-color: var(--accent); color: var(--accent); }
  .stage { text-align: center; }
  .now { min-height: 92px; }
  .now span { display: block; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  .now strong {
    font-family: var(--sans); font-weight: 700; font-size: 44px; line-height: 1;
    letter-spacing: 0; display: block;
  }
  .stage.dap .now strong { color: var(--accent); }
  .stage.nhac .now strong { color: var(--nhac); }
  .stage.assist-off .now, .stage.assist-off .lamps { visibility: hidden; }
  .footwrap { height: 96px; display: flex; align-items: flex-end; justify-content: center; }
  .foot { transform-origin: 75% 80%; transition: transform .09s ease-out; transform: translateY(-18px) rotate(-16deg); }
  .stage.dap .foot { transform: translateY(14px) rotate(7deg); }
  .stage.dap-up .foot { transform: translateY(-12px) rotate(-10deg); }
  .stage.nhac .foot { transform: translateY(-18px) rotate(-16deg); }
  .stage.assist-off .foot { transform: none; }
  .ground { height: 2px; margin: 0 24px; background: #6d665c; border-radius: 2px; position: relative; }
  .ground.stamp::after {
    content: ""; position: absolute; left: 50%; top: -6px; width: 16px; height: 8px;
    margin-left: -8px; border-radius: 50%; background: rgba(198, 83, 36, .35);
    animation: puff .35s ease-out forwards;
  }
  @keyframes puff { from { transform: scale(.4); opacity: .8; } to { transform: scale(1.8); opacity: 0; } }
  .lamps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .lamps i {
    font-style: normal; text-align: center; border-radius: 6px;
    background: var(--raise); color: var(--soft); padding: 8px 2px; font-weight: 800; font-size: 13px;
  }
  .lamps i b { display: block; font-size: 11px; font-weight: 700; opacity: .7; }
  .lamps i.on.m-dap { background: var(--accent); color: white; }
  .lamps i.on.m-nhac { background: var(--nhac); color: white; }
  .rgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .rcard {
    text-align: left; background: var(--raise); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 12px; box-shadow: none;
  }
  .rcard.on { border-color: var(--accent); box-shadow: none; }
  .rcard strong { display: block; font-size: 15px; }
  .rcard em { font-style: normal; color: var(--soft); font-weight: 600; font-size: 13px; }
  .pieces { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .piece-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .piece-tabs.nums { flex-wrap: nowrap; overflow-x: auto; }
  .piece-tabs .btn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .group-title { margin: 18px 0 0; font-size: 18px; }
  .piece {
    display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--raise);
  }
  .piece-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .piece p { margin: 4px 0 0; color: var(--soft); font-size: 13px; }
  .line-acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .line-report { flex-basis: 100%; margin: 2px 0 0; font-size: 14px; font-weight: 650; }
  .line-report ul { margin: 6px 0 0; padding-left: 18px; font-weight: 650; }
  .line-report li { margin: 3px 0; }
  .line-report .ok { color: var(--good); }
  .line-report .miss { color: var(--bad); }
  .line-report .live-word { font-family: var(--sans); font-size: 28px; line-height: 1.1; margin: 0; font-weight: 700; }
  .finger-card { min-width: 0; }
  .finger-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
  .finger-head strong { font-family: var(--sans); font-size: 20px; font-weight: 700; line-height: 1; }
  .finger-head span { color: var(--soft); font-weight: 650; font-size: 13px; }
  .flute {
    display: grid;
    grid-template-columns: auto repeat(10, minmax(0, 1fr)) auto;
    gap: 2px;
    align-items: start;
    overflow: hidden;
    padding: 8px 8px 4px;
    min-width: 0;
    background: var(--paper);
    border-radius: 6px;
  }
  .mouth-mark { font-size: 10px; font-weight: 800; color: #5c564e; padding-top: 6px; }
  .hole { width: auto; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .hole i {
    width: 22px; height: 22px; border-radius: 50%; background: #241c16;
    box-shadow: inset 0 0 0 2px #241c16; display: block; margin: 2px 0;
  }
  .hole.small i, .hole.under i { width: 12px; height: 12px; }
  .hole.small i { transform: translateY(-3px); }
  .hole.under i { transform: translateY(4px); }
  .finger-brief .hole b, .finger-brief .hole small { display: none; }
  .finger-brief .flute { align-items: center; padding: 6px 0 2px; }
  .finger-brief .mouth-mark { padding-top: 0; }
  .finger-brief .hole.small i, .finger-brief .hole.under i { transform: none; }
  .hole.open i { background: #fff; }
  .hole.half i { background: linear-gradient(90deg, #241c16 52%, #fff 52%); }
  .hole b { color: #241c16; }
  .hole small { color: #62584e; }
  .hole b, .hole small { display: block; max-width: 100%; overflow-wrap: anywhere; font-size: 10px; line-height: 1.15; text-align: center; font-weight: 700; }
  .hole.open small, .hole.half small { color: #8d5a16; }
  .finger-picks .btn { padding: 6px 10px; }
  .finger-strip { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 8px; }
  .finger-strip b { font-size: 13px; margin-right: 4px; }
  .finger-strip i {
    width: 14px; height: 14px; border-radius: 50%; background: #070605;
    box-shadow: inset 0 0 0 1.5px #efeae0; display: block;
  }
  .finger-strip i.dot-small { width: 10px; height: 10px; }
  .finger-strip i.open { background: #fff; }
  .finger-strip i.half { background: linear-gradient(90deg, #070605 52%, #fff 52%); }
  .finger-mini { margin: 4px 0 0; color: var(--soft); font-size: 13px; font-weight: 650; }
  .system.live-line .staff-line { stroke: var(--accent); }
  .note.mark-bad .head, .note.hearing-bad .head { fill: var(--bad); }
  .note.mark-good .head, .note.hearing-good .head { fill: var(--good); }
  .note.head-open.mark-bad .head { fill: #fff7f2; stroke: var(--bad); stroke-width: 2.4; }
  .note.head-open.mark-good .head { fill: #f3fbf6; stroke: var(--good); stroke-width: 2.4; }
  .note.mark-empty .head { fill: transparent; stroke: #8a8175; stroke-width: 1.8; }
  .note.mark-bad { cursor: pointer; }
  .practice-fit > .card.pair-card .score-scroll { max-height: none; flex: 1 1 auto; }
  .badge { font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--accent-ink); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 6px; margin-top: 8px; }
  .choices button {
    text-align: left; background: var(--raise); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; font-weight: 700; font-size: 14px;
  }
  .choices button.correct { background: var(--good-bg); border-color: var(--good); }
  .choices button.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .choices.locked button { pointer-events: none; }
  .feedback { min-height: 1.4em; font-weight: 700; margin: 10px 0 0; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .progress { color: var(--soft); font-weight: 700; font-size: 13px; margin: 0 0 8px; }
  .pads { display: grid; gap: 8px; margin-top: 8px; }
  .pad {
    border-radius: 8px; border: 1px solid var(--line); min-height: 84px;
    font-weight: 800; font-size: 22px; letter-spacing: .04em;
  }
  .pad small { display: block; font-weight: 650; font-size: 12px; letter-spacing: 0; opacity: .8; }
  .pad.dap { background: #3a2a1c; color: var(--accent-ink); }
  .pad.nhac { background: #1a2c36; color: var(--nhac-ink); }
  .pad.due.dap { background: var(--accent); color: white; }
  .pad.due.nhac { background: var(--nhac); color: white; }
  .pad.flash-good { box-shadow: inset 0 0 0 3px var(--good); }
  .pad.flash-bad { box-shadow: inset 0 0 0 3px var(--bad); }
  .live { font-weight: 800; min-height: 1.4em; margin: 8px 0; }
  .keys { color: var(--soft); font-size: 13px; margin: 8px 0 0; }
  .sum { font-family: var(--sans); font-weight: 700; font-size: 28px; margin: 0 0 8px; }
  .shake { animation: shake .35s ease; }
  @keyframes shake {
    20% { transform: translateX(-4px); } 40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); } 80% { transform: translateX(2px); }
  }
  .toast {
    position: fixed; bottom: 18px; left: 50%; z-index: 5;
    transform: translateX(-50%) translateY(10px);
    background: var(--raise); color: var(--ink); padding: 10px 14px; border-radius: 6px;
    border: 1px solid var(--line);
    font-weight: 700; opacity: 0; pointer-events: none; transition: .18s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.good { background: var(--good); }
  .toast.bad { background: var(--bad); }
  .foot-note { color: var(--soft); font-size: 14px; }
  .breath-fit { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .breath-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(220px, 280px) minmax(0, 1fr); gap: 8px; }
  .breath-side, .wave-card { min-height: 0; overflow: hidden; }
  .breath-side { display: flex; flex-direction: column; }
  .breath-id { display: flex; gap: 8px; align-items: center; }
  #breathStaff { flex: none; background: var(--paper); border-radius: 6px; }
  #breathStaff svg { width: 92px; height: auto; display: block; }
  .target-name { font-family: var(--sans); font-weight: 700; font-size: 24px; line-height: 1; margin: 0; }
  .breath-id p { margin: 2px 0 0; font-weight: 700; color: var(--soft); font-size: 12px; }
  .breath-side .finger-mini {
    margin: 2px 0 0; font-size: 12px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .breath-side .verdict { margin: 4px 0; min-height: 2.6em; }

  }

    const beatPos = Math.min(f.beatPos, f.totalBeats);
    host.querySelectorAll(".system").forEach((sys) => {
      const from = Number(sys.dataset.from);
      const to = Number(sys.dataset.to);

      const beatW = Number(sys.dataset.beatw);

}

function rhymeHTML(note) {

  const spaces = ["Fa", "La", "Đồ", "Mi"];
  const lineHit = note.pos >= 0 && note.pos % 2 === 0 ? note.pos / 2 : -1;
  const spaceHit = note.pos >= 1 && note.pos % 2 === 1 ? (note.pos - 1) / 2 : -1;
  const line = lines.map((w, i) => `<b class="${i === lineHit ? "hit" : ""}">${w}</b>`).join(" · ");
  const space = spaces.map((w, i) => `<b class="${i === spaceHit ? "hit" : ""}">${w}</b>`).join(" · ");
  return `<div class="mnemonic">
    <p>Năm dòng, từ dưới lên: ${line}</p>
    <p>Bốn khe, từ dưới lên: ${space}</p>

}

function fingerIdOf(note) {

function registerOf(note) {

function holeState(note) {

  const high = reg >= 2;
  if (id === "Bb4" && reg >= 2) {
    return {
      id, high, reg,
      open: ["li", "lr", "ri", "rm", "rr"],
      half: [],
      hint: "Si giáng cao độ " + reg + ": chỉ bịt ngón giữa trái, lỗ La. Các lỗ chính khác mở."
    };
  }
  const lowName = (noteById(id) || {}).name || "";
  let hint = FINGER_HINT[id] || "";
  if (reg === 2) hint = "Cao độ 2, cùng thế ngón với " + lowName + ". Hơi mạnh và hẹp hơn cao độ 1. Không mở thêm lỗ.";
  else if (reg === 3) hint = "Cao độ 3, cùng thế ngón với " + lowName + ". Hơi nhanh hơn cao độ 2: môi khít, tia hơi hất lên mép lỗ thổi. Không mở thêm lỗ.";
  return { id, high, reg, open: OPEN_HOLES[id] || [], half: HALF_HOLES[id] || [], hint };
}
function noteIdForReg(reg, pc) {
  const row = REG_NOTES[reg] || REG_NOTES[1];
  const hit = row.find((pid) => ((noteById(pid).midi % 12) + 12) % 12 === pc);
  if (hit) return hit;
  let best = row[0];
  let dist = 99;
  row.forEach((pid) => {
    const p = ((noteById(pid).midi % 12) + 12) % 12;
    const d = Math.min((p - pc + 12) % 12, (pc - p + 12) % 12);
    if (d < dist) { dist = d; best = pid; }
  });
  return best;
}

function makeQuiz() {
  const scale = activeNotes();
  const level = state.level;
  const items = [];
  if (state.practice === "name") {
    const fingers = ["Cs4", "Ds4", "Fs4", "Gs4"].map((id) => noteById(id));
    const pool = scale.concat(fingers);
    const choices = shuffle(pool.map((n) => ({ id: n.id, label: n.name })));
    for (let i = 0; i < 30; i++) {
      const note = pool[Math.floor(Math.random() * pool.length)];
      const place = PLACE[note.id] ? PLACE[note.id][0] : "";
      items.push({
        notes: [{ ...note, e: 2 }],
        prompt: "Nốt trên khuông tên là gì?",
        answer: note.id,
        choices,
        explain: `Đây là nốt ${note.name}. ${place}.`,
        noteId: note.id,
        hear: note.midi
      });
    }
  } else if (state.practice === "value") {
    const bank = valueBank().filter((q) => q.level <= level);
    for (let i = 0; i < 30; i++) {
      const q = bank[Math.floor(Math.random() * bank.length)];
      const pitch = scale[Math.floor(Math.random() * Math.min(6, scale.length))];
      const notes = q.e.map((e, idx) => ({ ...scale[Math.min(scale.length - 1, scale.indexOf(pitch) + idx)], e }));
      const pool = shuffle(bank.filter((b) => b.answer !== q.answer)).slice(0, 3).map((b) => b.answer);
      items.push({
        notes,
        prompt: q.prompt,
        answer: q.answer,
        choices: shuffle([q.answer, ...pool].map((label) => ({ id: label, label }))),
        explain: "Chưa phải. Đáp án: " + q.answer + ".",
        hear: pitch.midi
      });
    }
  } else if (state.practice === "read") {
    for (let i = 0; i < 30; i++) {
      const pat = PATTERNS[level][Math.floor(Math.random() * PATTERNS[level].length)];
      const notes = melodyFrom(pat, scale);
      const focus = Math.floor(Math.random() * notes.length);
      const n = notes[focus];
      const askName = Math.random() < 0.55;
      if (askName) {
        items.push({
          notes, hot: focus,
          prompt: "Nốt đang khoanh tên là gì?",
          answer: n.id,
          choices: shuffle(scale.map((x) => ({ id: x.id, label: x.name }))),
          explain: `Nốt đang khoanh là ${n.name}. ${PLACE[n.id][0]}.`,
          noteId: n.id,
          hear: n.midi
        });
      } else {
        const answer = phraseOf(n.e);
        const pool = shuffle(RHYTHMS.map((r) => phraseOf(r.e)).filter((p) => p !== answer)).slice(0, 3);
        items.push({
          notes, hot: focus,
          prompt: "Nốt đang khoanh dài bao lâu?",
          answer,
          choices: shuffle([answer, ...pool].map((label) => ({ id: label, label }))),
          explain: "Nốt này dài " + answer + ". Nốt đen là 1 phách, nốt trắng là 2 phách. Đánh lưỡi khi nốt bắt đầu, rồi giữ hơi cho hết độ dài đó.",
          hear: n.midi
        });
      }
    }
  }
  return { mode: state.practice, level, items, index: 0, locked: false };
}
function phraseOf(e) {
  if (e >= 8) return "4 phách";
  if (e === 6) return "3 phách";
  if (e === 4) return "2 phách";
  if (e === 3) return "1½ phách";
  if (e === 2) return "1 phách";
  return "½ phách";
}
function valueBank() {
  return [
    { level: 1, e: [2], prompt: "Nốt đen này dài bao lâu?", answer: "1 phách" },
    { level: 1, e: [4], prompt: "Nốt trắng này dài bao lâu?", answer: "2 phách" },
    { level: 1, e: [8], prompt: "Nốt tròn này dài bao lâu?", answer: "4 phách" },
    { level: 2, e: [6], prompt: "Nốt trắng chấm này dài bao lâu?", answer: "3 phách" },
    { level: 2, e: [1, 1], prompt: "Hai nốt móc đơn này bằng bao lâu?", answer: "1 phách" },
    { level: 3, e: [3], prompt: "Nốt đen chấm này dài bao lâu?", answer: "1½ phách" },
    { level: 3, e: [3, 1], prompt: "Đen chấm cộng nốt móc bằng bao lâu?", answer: "2 phách" }
  ];
}
function melodyFrom(pattern, scale) {
  let idx = [0, 2, Math.min(4, scale.length - 1)][Math.floor(Math.random() * 3)] % scale.length;
  const steps = [0, 1, -1, 1, -1, 2, -2];
  return pattern.map((e) => {
    const note = { ...scale[idx], e };
    idx = Math.max(0, Math.min(scale.length - 1, idx + steps[Math.floor(Math.random() * steps.length)]));
    return note;
  });
}

const SOLFE = ["Đồ", "Đồ thăng", "Rê", "Rê thăng", "Mi", "Fa", "Fa thăng", "Son", "Son thăng", "La", "Si giáng", "Si"];
const PITCH = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "Bb", "B"];
const FLUTE = [];
for (let midi = 72; midi <= 103; midi++) FLUTE.push(midi);

function staffPos(midi) {
  const base = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 6, 6][midi % 12];
  return base + (Math.floor(midi / 12) - 5) * 7 - 2;
}
function hzOf(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
function fluteNote(midi) {
  const pc = midi % 12;
  const sci = PITCH[pc] + (Math.floor(midi / 12) - 1);
  const oct = midi >= 96 ? 3 : midi >= 84 ? 2 : 1;
  const name = oct === 1 && pc === 0 ? "Đồ thấp" : SOLFE[pc] + (oct > 1 ? " " + oct : "");
  const band = "Cao độ " + oct;
  return { midi, sci, name, band, oct, hz: hzOf(midi) };
}
function breathStaff(midi) {
  const pc = midi % 12;
  const sharp = pc === 1 || pc === 3 || pc === 6 || pc === 8;
  const flat = pc === 10;
  const pos = staffPos(midi);
  const px = 8;
  const h = 170;
  const mid = h / 2;
  const y = (p) => mid - (p - pos) * px;
  const parts = [`<svg viewBox="0 0 200 ${h}" width="200" height="${h}" aria-hidden="true">`];
  [0, 2, 4, 6, 8].forEach((line) => {
    const ly = y(line);
    if (ly >= 8 && ly <= h - 8) parts.push(`<line x1="16" y1="${ly}" x2="184" y2="${ly}" stroke="#241c16" stroke-width="1.3"/>`);
  });
  if (pos <= -2) {
    for (let p = -2; p >= (pos % 2 === 0 ? pos : pos - 1); p -= 2) {
      parts.push(`<line x1="78" y1="${y(p)}" x2="122" y2="${y(p)}" stroke="#241c16" stroke-width="1.3"/>`);
    }
  }
  if (pos >= 10) {
    for (let p = 10; p <= (pos % 2 === 0 ? pos : pos + 1); p += 2) {
      parts.push(`<line x1="78" y1="${y(p)}" x2="122" y2="${y(p)}" stroke="#241c16" stroke-width="1.3"/>`);
    }
  }
  if (sharp) parts.push(`<text x="70" y="${mid + 8}" text-anchor="middle" font-family="Georgia, serif" font-size="28">♯</text>`);
  if (flat) parts.push(`<text x="70" y="${mid + 8}" text-anchor="middle" font-family="Georgia, serif" font-size="28">♭</text>`);
  parts.push(`<ellipse cx="104" cy="${mid}" rx="11" ry="7.5" transform="rotate(-18 104 ${mid})" fill="#241c16"/>`);
  parts.push(`<line x1="114" y1="${mid}" x2="114" y2="${mid - 34}" stroke="#241c16" stroke-width="1.7"/>`);
  parts.push(`</svg>`);
  return parts.join("");
}

      if (!all.length) return;
      let page = 0;
      if (host.closest(".note-staff")) {
        const sel = host.querySelector(".note.sel");
        const keep = sel ? sel.closest("svg") : all[0];
        page = Math.max(0, all.indexOf(keep));
      } else {
        page = Number(host.dataset.page || 0);
        if (page >= all.length) page = 0;
        host.dataset.page = String(page);
      }
      all.forEach((svg, i) => { svg.style.display = i === page ? "block" : "none"; });
      ensureLineSwitch(host, page, all.length);
      const svg = all[page];
      const natW = Number(svg.getAttribute("width"));
      const natH = Number(svg.getAttribute("height"));
      const cs = getComputedStyle(host);
      const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
      const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
      const availW = host.clientWidth - padX;
      const availH = host.clientHeight - padY;
      if (availW < 80 || availH < 80 || natW < 20 || natH < 20) return;
      const scale = Math.min(availW / natW, availH / natH);
      svg.style.width = Math.floor(natW * scale) + "px";
      svg.style.height = Math.floor(natH * scale) + "px";

  }
  const onsets = lineOnsets(samples);
  const used = new Set();
  const comments = [];
  const marks = [];

  items.forEach((n) => {
    const start = (n.start - fromE) / 2 * beatDur;
    const dur = Math.max(0.12, (n.e / 2) * beatDur);
    const win = Math.min(0.18, Math.max(0.09, dur * 0.42));
    const tight = Math.min(0.12, win * 0.72);

    let onsetIndex = -1;
    onsets.forEach((s, i) => {
      if (used.has(i)) return;
      const d = Math.abs(s.t - start);
      if (d <= best) { best = d; onset = s; onsetIndex = i; }
    });
    if (onsetIndex >= 0) used.add(onsetIndex);

    }

      if (!onset) problems.push("thiếu đánh lưỡi");
      else if (onset.t < start - tight) problems.push("đánh lưỡi sớm");
      else if (onset.t > start + tight) problems.push("đánh lưỡi trễ");
    } else if (onset) {
      problems.push("đáng lẽ luyến, lại đánh lưỡi");
    }
    if (pitch === "silent") {
      const energy = samples.reduce((m, s) => (s.t >= start && s.t <= start + dur ? Math.max(m, s.rms) : m), 0);
      problems.push(energy >= 0.02 ? "có hơi nhưng chưa ra nốt rõ" : "mic không nghe ra nốt");
    }

  if (!grade.comments.length) {
    setLineReport(pieceId, `<p class="ok">${lineNo} đạt. Đánh lưỡi, nhịp và nốt đều khớp bài.</p>${again}`);
    return;
  }
  const list = grade.comments.slice(0, 8).map((c) => `<li>${esc(c.text)}</li>`).join("");
  const more = grade.comments.length > 8 ? `<li>Và ${grade.comments.length - 8} chỗ nữa.</li>` : "";

function armRecorder(stream) {
  if (lineListen.recOn || !window.MediaRecorder) return;
  try {
    const rec = new MediaRecorder(stream);
    lineListen.chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) lineListen.chunks.push(e.data); };
    rec.start(250);
    lineListen.rec = rec;
    lineListen.recOn = true;
  } catch (err) { lineListen.recOn = false; }
}
function finishRecorder() {
  const rec = lineListen.rec;
  const key = (lineListen.pieceId || "") + ":" + lineListen.from;
  if (!rec || rec.state !== "recording") return Promise.resolve((lineListen.takes && lineListen.takes[key]) || "");
  return new Promise((resolve) => {
    rec.onstop = () => {
      let url = "";
      try {
        const blob = new Blob(lineListen.chunks || [], { type: rec.mimeType || "audio/webm" });
        if (blob.size > 400) {
          if (lineListen.takes[key]) URL.revokeObjectURL(lineListen.takes[key]);
          url = URL.createObjectURL(blob);
          lineListen.takes[key] = url;
        }
      } catch (err) { url = ""; }
      resolve(url);
    };
    try { rec.stop(); } catch (err) { resolve(""); }
  });
}
async function playTake(url) {
  const ctx = await engine.ac();
  if (!ctx || !url) return;
  engine.stop();
  let audioBuf;
  try {
    const res = await fetch(url);
    const raw = await res.arrayBuffer();
    audioBuf = await ctx.decodeAudioData(raw.slice(0));
  } catch (err) {
    toast("Chưa phát lại được hơi vừa thổi. Hãy tập dòng lại.");
    return;
  }
  const src = ctx.createBufferSource();
  src.buffer = audioBuf;
  const g = ctx.createGain();
  let peak = 0;
  const ch = audioBuf.getChannelData(0);
  for (let i = 0; i < ch.length; i += 32) peak = Math.max(peak, Math.abs(ch[i]));
  g.gain.value = peak > 0.001 ? Math.min(8, 0.4 / peak) : 1;
  src.connect(g);
  g.connect(ctx.destination);
  src.start();
  engine.nodes.push(src);
}
async function playSlice(url, offset, dur) {
  const ctx = await engine.ac();
  if (!ctx || !url) return;
  engine.stop();
  let audioBuf;
  try {
    const res = await fetch(url);
    const raw = await res.arrayBuffer();
    audioBuf = await ctx.decodeAudioData(raw.slice(0));
  } catch (err) {
    toast("Chưa phát được tiếng này.");
    return;
  }
  const src = ctx.createBufferSource();
  src.buffer = audioBuf;
  const g = ctx.createGain();
  g.gain.value = 1;
  src.connect(g);
  g.connect(ctx.destination);
  const start = Math.max(0, Math.min(offset || 0, Math.max(0, audioBuf.duration - 0.05)));
  const length = Math.max(0.2, Math.min(dur || 0.6, audioBuf.duration - start));
  src.start(ctx.currentTime, start, length);
  engine.nodes.push(src);
}
async function practiceLine(el) {
  const pieceId = el.dataset.id;
  const from = Number(el.dataset.from);
  const to = Number(el.dataset.to);
  const lineNo = el.dataset.line;
  const piece = PIECES.find((p) => p.id === pieceId);
  if (!piece) return;
  if (lineListen.on && lineListen.pieceId === pieceId && lineListen.from === from && lineListen.to === to) {
    stopLineListen();
    setLineReport(pieceId, lineNo === "all" ? "<p>Đã dừng.</p>" : "<p>Đã dừng dòng này.</p>");
    return;
  }
  stopLineListen();
  stopBreathListen();
  engine.stop();
  const token = ++lineListen.token;
  if (!window.isSecureContext) {
    setLineReport(pieceId, `<p class="miss">Mic bị chặn vì đang mở file. Hãy vào http://localhost:8753 rồi tập lại.</p>`);
    return;
  }
  const ctxPromise = engine.ac();
  let stream;
  try {
    stream = await openMic();
  } catch (err) {
    const denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
    setLineReport(pieceId, `<p class="miss">${denied ? "Trình duyệt chặn mic. Bấm biểu tượng khóa cạnh địa chỉ và cho phép Mic." : "Không mở được mic. Hãy chọn mic khác rồi thử lại."}</p>`);
    return;
  }
  if (token !== lineListen.token) return;
  const playCtx = await ctxPromise;
  if (!playCtx || token !== lineListen.token) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  const micCtx = new AC();
  if (micCtx.state === "suspended") await micCtx.resume();
  const analyser = micCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0;
  micCtx.createMediaStreamSource(stream).connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  const notes = resolve(piece.seq);
  const laid = layout(notes);
  const plan = beatPlan(notes);
  const preview = document.querySelector('.preview[data-piece="' + pieceId + '"]');
  const beatDur = 60 / state.bpm;
  const readyBeats = 1;
  const countIn = 4;
  const audioNow = playCtx.currentTime;
  const perfNow = performance.now();
  const origin = audioNow + 0.08 + (readyBeats + countIn) * beatDur;
  const lineStartPerf = perfNow + (origin - audioNow) * 1000;
  const countAt = audioNow + 0.08 + readyBeats * beatDur;
  for (let i = 0; i < countIn; i++) tick(playCtx, countAt + i * beatDur, i % 2 === 0);
  lineListen.on = true;
  lineListen.token = token;
  lineListen.pieceId = pieceId;
  lineListen.from = from;
  lineListen.to = to;
  lineListen.stream = stream;
  lineListen.ctx = micCtx;
  lineListen.analyser = analyser;
  lineListen.buf = buf;
  lineListen.samples = [];
  lineListen.curStart = null;
  lineListen.caption = "";
  const lineTitle = lineNo === "all" ? (el.dataset.count + " nốt") : ("Dòng " + lineNo);
  document.querySelectorAll("[data-act='practice-line']").forEach((b) => {
    b.classList.remove("on");
    b.textContent = lineButtonText(b, false);
  });
  el.classList.add("on");
  el.textContent = lineButtonText(el, true);
  if (preview) {
    preview.querySelectorAll(".note").forEach((n) => {
      n.classList.remove("mark-bad", "mark-good", "mark-empty", "hearing-good", "hearing-bad");
      if (n.getAttribute("data-act") === "hear-spot") n.removeAttribute("data-act");
    });
    preview.querySelectorAll(".system").forEach((sys, index) => {
      const mine = Math.abs(Number(sys.dataset.from) - from / 2) < 0.01;
      sys.classList.toggle("live-line", mine);
      if (mine) preview.dataset.page = String(index);
    });
    fitScores();
  }
  setLineReport(pieceId, `<p>${lineTitle}: chân giơ, rồi đếm. Vào ở phách 1, lúc đập.</p>`);
  const endAt = origin + ((to - from) / 2) * beatDur;
  function frame() {
    if (token !== lineListen.token) return;
    const now = playCtx.currentTime;
    const elapsed = (now - origin) / beatDur;
    const ready = now < origin - countIn * beatDur;
    const counting = !ready && now < origin;
    const countBeat = (now - (origin - countIn * beatDur)) / beatDur;
    statePlan = plan;
    paintFrame({ beatPos: from / 2 + elapsed, counting, countBeat, ready, totalBeats: laid.totalBeats });
    if (preview && elapsed >= 0) {
      const beatPos = from / 2 + elapsed;
      preview.querySelectorAll(".system").forEach((sys, index) => {
        const fromB = Number(sys.dataset.from);
        const toB = Number(sys.dataset.to);
        const left = Number(sys.dataset.left);
        const beatW = Number(sys.dataset.beatw);
        const head = sys.querySelector(".playhead");
        const fill = sys.querySelector(".time-fill");
        const inTake = fromB >= from / 2 - 0.01 && toB <= to / 2 + 0.01;
        if (!inTake || beatPos < fromB) {
          if (head) head.setAttribute("opacity", "0");
          return;
        }
        if (beatPos >= toB) {
          if (head) head.setAttribute("opacity", "0");
          if (fill) fill.setAttribute("width", String((toB - fromB) * beatW));
          return;
        }
        if (preview.dataset.page !== String(index)) {
          preview.dataset.page = String(index);
          preview.querySelectorAll(".system").forEach((s) => s.classList.remove("live-line"));
          sys.classList.add("live-line");
          fitScores();
        }
        const x = left + (beatPos - fromB) * beatW;
        if (head) {
          head.setAttribute("x1", x);
          head.setAttribute("x2", x);
          head.setAttribute("opacity", "1");
        }
        if (fill) fill.setAttribute("width", String(Math.max(0, x - left)));

    }
    if (lineListen.analyser) {
      lineListen.analyser.getFloatTimeDomainData(lineListen.buf);
      const heard = hearFlute(lineListen.buf, micCtx.sampleRate);

      if (t >= -0.05) lineListen.samples.push({ t, rms: heard.hz ? heard.rms : 0, hz: heard.hz });
      if (elapsed >= 0 && stream) armRecorder(stream);
      const lineNotes = laid.items.filter((n) => n.start >= from && n.start < to);
      if (counting) {
        const n = Math.floor(countBeat) + 1;
        if (n >= 1 && n <= 4) {
          const caption = "Đếm " + n;
          if (lineListen.caption !== caption) {
            lineListen.caption = caption;
            setLineReport(pieceId, `<p class="live-word">${caption}. ${n % 2 === 1 ? "Đập" : "Nhấc"}.</p>${fingerStrip(lineNotes[0])}`);
          }
        }
      } else if (elapsed >= 0 && now < endAt) {
        const epos = from + elapsed * 2;
        const cur = lineNotes.find((n) => epos >= n.start && epos < n.start + n.e);
        if (cur) paintFingers(cur);
        let caption = "Đang nghe";
        if (cur && heard.hz > 0 && flutePitchOk(heard.hz, cur.midi)) caption = "Đúng " + cur.name;
        else if (cur && heard.hz > 0) caption = "Sai · bài là " + cur.name + ", mic nghe " + solfeFromHz(heard.hz);
        else if (cur && heard.noise) caption = "Tạp âm, tới " + cur.name;
        else if (cur) caption = "Tới " + cur.name;
        if (preview && cur) {
          preview.querySelectorAll(".note").forEach((el) => {
            if (Number(el.dataset.start) !== cur.start) return;
            const good = heard.hz > 0 && flutePitchOk(heard.hz, cur.midi);
            const bad = heard.hz > 0 && !good;
            if (!good && !bad) return;
            el.classList.toggle("hearing-good", good);
            el.classList.toggle("hearing-bad", bad);
          });
        }
        if (lineListen.caption !== caption) {
          lineListen.caption = caption;
          const kind = caption.indexOf("Đúng") === 0 ? "ok" : caption.indexOf("Sai") === 0 ? "miss" : "";
          setLineReport(pieceId, `<p class="live-word ${kind}">${esc(caption)}</p>${fingerStrip(cur)}`);
        }
      }
    }
    if (now < endAt + 0.2) {
      lineListen.raf = requestAnimationFrame(frame);
      return;
    }
    const gradeToken = token;
    finishRecorder().then((url) => {
      if (gradeToken !== lineListen.token) return;
      const grade = gradeLine(notes, from, to, lineListen.samples, beatDur);
      if (preview) showLineGrade(pieceId, lineTitle, preview, from, to, grade, url);
      stopLineListen();
    });
  }
  lineListen.raf = requestAnimationFrame(frame);
}

const pairListen = { on: false, token: 0, raf: 0, stream: null, ctx: null, analyser: null, buf: null };
function stopPairListen() {
  pairListen.on = false;
  pairListen.token++;
  if (pairListen.raf) cancelAnimationFrame(pairListen.raf);
  pairListen.raf = 0;
  pairListen.stream = null;
  if (pairListen.ctx) pairListen.ctx.close().catch(() => {});
  pairListen.ctx = null;
  pairListen.analyser = null;
  const btn = document.getElementById("pairMic");
  if (btn) btn.textContent = "Thổi cặp";
}
async function startPairListen() {
  stopPairListen();
  stopFingerListen();
  stopQuizListen();
  stopBreathListen();
  const pair = FINGER_PAIRS[state.pair] || FINGER_PAIRS[0];
  const notes = pairNotes(pair);
  const verdict = document.getElementById("pairVerdict");
  if (!window.isSecureContext || !navigator.mediaDevices) {
    if (verdict) verdict.textContent = "Mic cần http://localhost:8753.";
    return;
  }
  const token = ++pairListen.token;
  let stream;
  try { stream = await openMic(); }
  catch (err) {
    if (verdict) verdict.textContent = "Trình duyệt chưa cho dùng mic.";
    return;
  }
  if (token !== pairListen.token) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  if (ctx.state === "suspended") await ctx.resume();
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0;
  ctx.createMediaStreamSource(stream).connect(analyser);
  pairListen.on = true;
  pairListen.stream = stream;
  pairListen.ctx = ctx;
  pairListen.analyser = analyser;
  pairListen.buf = new Float32Array(analyser.fftSize);
  const btn = document.getElementById("pairMic");
  if (btn) btn.textContent = "Dừng";
  const beat = 60 / 48;
  const origin = ctx.currentTime + 0.08 + 5 * beat;
  for (let i = 0; i < 4; i++) tick(ctx, ctx.currentTime + 0.08 + (1 + i) * beat, i % 2 === 0);
  const samples = [];
  const frame = () => {
    if (token !== pairListen.token || !pairListen.on) return;
    analyser.getFloatTimeDomainData(pairListen.buf);
    const heard = hearFlute(pairListen.buf, ctx.sampleRate);
    const t = ctx.currentTime - origin;
    if (t >= 0) samples.push({ t, hz: heard.hz, rms: heard.rms });
    const box = document.getElementById("pairVerdict");
    if (t < 0 && box) box.textContent = "Đếm chậm. Vào nốt đầu lúc đập.";
    if (ctx.currentTime < origin + 4 * beat) {
      pairListen.raf = requestAnimationFrame(frame);
      return;
    }
    stopPairListen();
    const first = samples.filter((s) => s.t < 2 * beat && s.hz > 0);
    const second = samples.filter((s) => s.t >= 2 * beat && s.hz > 0);
    const mid = samples.filter((s) => s.t >= 1.7 * beat && s.t <= 2.3 * beat);
    const aOk = first.length >= 3 && flutePitchOk(median(first.map((s) => s.hz)), notes[0].midi);
    const bOk = second.length >= 3 && flutePitchOk(median(second.map((s) => s.hz)), notes[1].midi);
    const linked = mid.some((s) => s.rms >= 0.01 || s.hz > 0);
    const host = document.getElementById("scoreHost");
    if (host) {
      host.querySelectorAll(".note").forEach((el, i) => {
        el.classList.remove("mark-bad", "mark-empty", "mark-good");
        const good = i === 0 ? aOk : bOk;
        const heardSome = (i === 0 ? first : second).length >= 3;
        if (!heardSome) el.classList.add("mark-empty");
        else if (!good) el.classList.add("mark-bad");
      });
    }
    if (box) {
      if (aOk && bOk && linked) box.textContent = "Đạt. Hơi liền, ngón đã đổi.";
      else if (!linked) box.textContent = "Hơi bị đứt giữa hai nốt. Giữ hơi, chỉ đổi ngón.";
      else box.textContent = (aOk ? "" : "Nốt đầu chưa đúng. ") + (bOk ? "" : "Nốt sau chưa đúng.");
    }
  };
  pairListen.raf = requestAnimationFrame(frame);
}

    if (state.demo.kind !== "rhythm") return;
    state.demo = { ...state.demo, view: el.dataset.view };
    go();
    startDemo();
  },
  "play-demo"() {
    if (engine.token && document.getElementById("playBtn")?.textContent === "Dừng") {
      engine.stop();
      idleFrame();
      const btn = document.getElementById("playBtn");
      if (btn) btn.textContent = "Nghe";
      return;
    }
    startDemo();
  },
  pulse() { startPulse(); },
  "rhythm-pane"(el) {
    state.rhythmPane = el.dataset.pane || "bai";
    go();
  },
  "mix-piece"() {
    remixPiece();
    state.shelf = "tron";
    state.shelfPiece = "tronbai";
    state.tapPiece = "tronbai";
    if (state.tab === "rhythm") state.rhythmPane = "bai";
    go();
  },
  shelf(el) {
    state.shelf = el.dataset.shelf;
    const g = pieceGroups().find((x) => x.id === state.shelf);
    state.shelfPiece = g ? g.ids[0] : state.shelfPiece;
    go();
  },
  "shelf-piece"(el) {
    state.shelfPiece = el.dataset.id;
    go();
  },
  "tap-shelf"(el) {
    const g = pieceGroups().find((x) => x.id === el.dataset.shelf);
    if (g) state.tapPiece = g.ids[0];
    go();
  },
  "staff-page"(el) {
    const bar = el.parentElement;
    const host = bar && bar.nextElementSibling;
    if (!host || !host.classList.contains("score-scroll")) return;
    host.dataset.page = el.dataset.page;
    fitScores();
  },
  "hear-piece"(el) {
    const id = el.dataset.id;
    const g = pieceGroups().find((x) => x.ids.includes(id));
    if (g) { state.shelf = g.id; state.shelfPiece = id; }
    state.demo = { kind: "piece", id };
    go();
    startDemo(4);
  },
  "tap-piece"(el) {
    state.tapPiece = el.dataset.id;
    state.tab = "practice";
    state.practice = "tap";
    go();
  },
  "tap-current"() {
    if (state.demo.kind === "piece") state.tapPiece = state.demo.id;
    else state.tapPiece = ({ q: "buoc", h: "trang", w: "tron", dh: "cham", e: "moc", dq: "dencham" })[state.demo.id] || "buoc";
    state.tab = "practice";
    state.practice = "tap";
    go();
  },
  practice(el) {
    state.practice = el.dataset.mode;
    state.quiz = null;
    go();
  },
  level(el) {
    state.level = Number(el.dataset.level);
    state.quiz = null;
    save();
    go();
  },
  "new-quiz"() {
    state.quiz = null;
    go();
  },
  answer(el) {
    const q = state.quiz;
    if (!q || q.locked || q.index >= q.items.length) return;
    const item = q.items[q.index];
    const choice = el.dataset.choice;
    const good = choice === item.answer;
    const blow = el.dataset.blow === "1";
    if (state.practice === "name" && !blow) {
      document.querySelectorAll("[data-choice]").forEach((b) => {
        b.classList.toggle("wrong", !good && b.dataset.choice === choice);
        b.classList.toggle("correct", good && b.dataset.choice === choice);
      });
      const fb = document.getElementById("feedback");
      if (fb) {
        fb.textContent = good ? "Đúng tên. Thổi đúng nốt này thì sang câu sau." : "Chưa phải. Thổi đúng nốt trên khuông thì sang câu sau.";
        fb.className = "feedback " + (good ? "good" : "bad");
      }
      return;
    }
    if (state.practice === "name" && !good) return;
    q.locked = true;
    q.good = (q.good || 0) + (good ? 1 : 0);
    document.querySelectorAll("[data-choice]").forEach((b) => {
      if (b.dataset.choice === item.answer) b.classList.add("correct");
      else if (b.dataset.choice === choice && !good) b.classList.add("wrong");
    });
    document.getElementById("choices")?.classList.add("locked");
    const fb = document.getElementById("feedback");
    if (fb) {
      fb.textContent = good ? "Đúng." : item.explain;
      fb.className = "feedback " + (good ? "good" : "bad");
    }
    if (!good) document.getElementById("scoreHost")?.classList.add("shake");
    if (item.noteId) markNote(item.noteId, good);
    else if (good) { state.stats.ok++; save(); }
    else { state.stats.bad++; save(); }
    if (item.hear && state.practice !== "name") playPitch(item.hear, 0.55);
    quizTimer = setTimeout(() => {
      if (!state.quiz || !state.quiz.locked) return;
      state.quiz.locked = false;
      state.quiz.index++;
      paint();
    }, good ? 750 : 1700);
  },
  "hear-quiz"() {
    const q = state.quiz;
    if (!q || q.index >= q.items.length) return;
    const item = q.items[q.index];
    quizListen.ignoreUntil = performance.now() + 2500;
    quizListen.holdId = "";
    playScore(item.notes, { countIn: layout(item.notes).totalBeats >= 4 ? 4 : 0 });
  },
  "quiz-mic"() {
    if (quizListen.on) {
      releaseMic();
      stopQuizListen();
      const btn = document.getElementById("quizMic");
      if (btn) { btn.textContent = "Thổi trả lời"; btn.classList.remove("primary"); }
      const fb = document.getElementById("feedback");
      if (fb && state.quiz && !state.quiz.locked) { fb.textContent = ""; fb.className = "feedback"; }
      return;
    }
    const btn = document.getElementById("quizMic");
    if (btn) btn.textContent = "Đang mở mic";
    startQuizListen();
  },
  "choose-piece"(el) {
    state.tapPiece = el.dataset.id;
    go();
  },
  "start-tap"() {
    const btn = document.getElementById("playBtn");
    if (btn && btn.textContent === "Dừng") {
      engine.stop();
      idleFrame();
      btn.textContent = "Bắt đầu";
      return;
    }
    const piece = PIECES.find((p) => p.id === state.tapPiece) || PIECES[0];
    const box = document.getElementById("tapResult");
    if (box) box.innerHTML = "";
    const live = document.getElementById("liveScore");
    if (live) live.textContent = "";
    document.querySelectorAll(".bcell").forEach((cell) => cell.classList.remove("good", "bad", "miss", "on"));
    playScore(resolve(piece.seq), {
      countIn: 4,
      tap: true,
      onEnd() {
        idleFrame();
        if (tapSession && tapSession.targets.some((t) => !t.resolved)) {
          tapSession.targets.forEach((t) => {
            if (!t.resolved) {
              t.resolved = true;
              tapSession.points.push("miss");
              markBeat(t, "miss");
            }
          });
        }
        if (document.getElementById("tapResult") && tapSession) finishTap();
        else if (document.getElementById("tapResult") && !document.getElementById("tapResult").textContent) {
          /* already finished early */
        }
      }
    });
    if (btn) btn.textContent = "Dừng";
  }
};

function onClick(e) {
  const el = e.target.closest("[data-act]");
  if (!el || !el.dataset.act) return;
  const fn = actions[el.dataset.act];
  if (fn) fn(el, e);
}
function onPointer(e) {
  const pad = e.target.closest("[data-tap]");
  if (!pad || e.button > 0) return;
  e.preventDefault();
  onTap(pad.dataset.tap);
}
function onInput(e) {
  if (e.target.id === "bpm") {
    state.bpm = Number(e.target.value);
    document.getElementById("bpmVal").textContent = state.bpm;
    save();
  }
  if (e.target.id === "sw-metro") { state.metro = e.target.checked; save(); }
  if (e.target.id === "sw-hint") {
    state.hint = e.target.checked;
    save();
    document.querySelectorAll(".score-scroll").forEach((el) => el.classList.toggle("assist-off", !state.hint));
    const stage = document.getElementById("stage");
    if (stage) stage.classList.toggle("assist-off", !state.hint);
  }
  if (e.target.id === "sw-extra") {
    state.extras = e.target.checked;
    if (!state.extras && noteById(state.selected).extra) state.selected = "A4";
    state.quiz = null;
    save();
    go();
  }
  if (e.target.id === "breathDevice" && !micHold.muteSelect && e.target.value !== micHold.deviceId) startBreathListen(e.target.value);
}
function onKey(e) {
  if (e.target.matches("input, textarea")) return;
  if (e.repeat) return;
  if (state.tab === "notes" && e.key >= "1" && e.key <= "8") {
    const n = activeNotes()[Number(e.key) - 1];
    if (n) actions["pick-note"]({ dataset: { id: n.id } });
  }
  if (state.tab === "breath") {
    if (e.key === "ArrowLeft") { e.preventDefault(); actions["breath-prev"](); }
    if (e.key === "ArrowRight") { e.preventDefault(); actions["breath-next"](); }
  }
  if (state.tab === "practice" && state.practice === "tap") {
    if (e.key === "ArrowDown" || e.key === "j" || e.key === "J") {
      e.preventDefault();
      onTap("dap");
    }
    if (e.key === "ArrowUp" || e.key === "k" || e.key === "K") {
      e.preventDefault();
      onTap("nhac");
    }
  }
}

function barsOk(seq) {
  let e = 0;
  for (let i = 0; i < seq.length; i++) {
    const dur = seq[i][1];
    if (e % 8 + dur > 8) return false;
    e += dur;
  }
  return e > 0 && e % 8 === 0;
}
function mixLine() {
  const scale = ["C4", "D4", "E4", "F4", "G4", "A4"];
  const durs = [1, 2, 2, 2, 4, 4, 3, 6, 8];
  const kinds = ["up", "down", "leap", "turn", "wave"];
  const contour = kinds[Math.floor(Math.random() * kinds.length)];
  let idx = Math.floor(Math.random() * scale.length);
  let dir = Math.random() < 0.5 ? 1 : -1;
  const seq = [];
  let barLeft = 8;
  while (seq.length < 30) {
    const local = Math.random() < 0.45 ? kinds[Math.floor(Math.random() * kinds.length)] : contour;
    const choices = durs.filter((d) => d <= barLeft);
    let dur = choices.length ? choices[Math.floor(Math.random() * choices.length)] : barLeft;
    if (seq.length === 29) dur = barLeft;
    seq.push([scale[idx], dur]);
    let step = dir;
    if (local === "up") step = 1;
    else if (local === "down") step = -1;
    else if (local === "leap") step = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.floor(Math.random() * 3));
    else if (Math.random() < (local === "turn" ? 0.5 : 0.28)) step = (Math.random() < 0.5 ? -1 : 1) * (Math.random() < 0.3 ? 2 : 1);
    let next = idx + step;
    if (next < 0) next = Math.min(scale.length - 1, 1);
    if (next >= scale.length) next = Math.max(0, scale.length - 2);
    if (next === idx) next = (idx + 1) % scale.length;
    idx = next;
    if (local === "turn" || local === "wave") dir = -dir;
    barLeft -= dur;
    if (barLeft <= 0) barLeft = 8;
  }
  return seq;
}
function mixLively(seq) {
  const durs = {};
  seq.forEach((n) => { durs[n[1]] = 1; });
  if (Object.keys(durs).length < 2) return false;
  const scale = ["C4", "D4", "E4", "F4", "G4", "A4"];
  let leaps = 0;
  for (let i = 1; i < seq.length; i++) {
    if (Math.abs(scale.indexOf(seq[i][0]) - scale.indexOf(seq[i - 1][0])) >= 2) leaps++;
  }
  return leaps >= 2;
}
function mixBlurb(seq) {
  const names = { C4: "Đồ", D4: "Rê", E4: "Mi", F4: "Fa", G4: "Son", A4: "La" };
  const head = seq.slice(0, 8).map((n) => names[n[0]] || n[0]).join(" ");
  return "Bài trộn 30 nốt trên thang Đồ. Tám nốt đầu: " + head + ". Mỗi ô đủ bốn phách. Bấm Tập 30 nốt để thổi một mạch, hoặc Trộn bài mới để đổi bài.";
}
function remixPiece() {
  const piece = PIECES.find((p) => p.id === "tronbai");
  if (!piece) return;
  const prev = JSON.stringify(piece.seq);
  let seq = mixLine();
  for (let i = 0; i < 24 && (JSON.stringify(seq) === prev || !barsOk(seq) || !mixLively(seq)); i++) seq = mixLine();
  if (!barsOk(seq)) {
    console.error("cross", "tronbai");
    return;
  }
  piece.seq = seq;
  piece.text = mixBlurb(seq);
}
function audit() {
  PIECES.forEach((p) => {
    let e = 0;
    p.seq.forEach((pair) => {
      if (e % 8 + pair[1] > 8) console.error("cross", p.id, e, pair[1]);
      e += pair[1];
    });
    if (e % 8 !== 0) console.error("sum", p.id, e);
  });
  Object.values(PATTERNS).flat().forEach((pat) => {
    const sum = pat.reduce((s, n) => s + n, 0);
    if (sum !== 8) console.error("pattern", pat, sum);
  });
}

function init() {
  remixPiece();
  audit();
  document.getElementById("bpm").value = String(state.bpm);
  document.getElementById("bpmVal").textContent = state.bpm;
  document.getElementById("sw-metro").checked = state.metro;
  document.getElementById("sw-hint").checked = state.hint;
  document.getElementById("sw-extra").checked = state.extras;
  document.body.addEventListener("click", onClick);
  document.body.addEventListener("pointerdown", onPointer);
  document.body.addEventListener("input", onInput);
  document.addEventListener("keydown", onKey);
  paint();
  noteVisit();
}
function noteVisit() {
  const el = document.getElementById("visitStat");
  if (!el) return;
  const say = (n) => { el.textContent = "Lượt mở: " + n; };
  if (location.hostname !== "30101992a.github.io") {
    say("—");
    return;
  }
  const cached = sessionStorage.getItem("nhacly-hit-n");
  if (cached) {
    say(cached);
    return;
  }
  say("…");
  fetch("https://hits.sh/30101992a.github.io/hoc-sao.svg", { cache: "no-store" })
    .then((res) => res.text())
    .then((svg) => {
      const found = svg.match(/hits:\s*(\d+)/);
      if (!found) return;
      sessionStorage.setItem("nhacly-hit-n", found[1]);
      say(found[1]);
    })
    .catch(() => { say("…"); });
}
init();
