<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141311">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Học sáo">
<title>Học nhạc lý — nốt và đập chân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141311;
    --ink: #ece8e1;
    --soft: #a39b90;
    --line: #3a3732;
    --card: #1e1d1a;
    --raise: #2a2824;
    --paper: #f4f0e6;
    --accent: #e0a04a;
    --accent-ink: #f0c98a;
    --on-accent: #1a140c;
    --nhac: #6aa8c4;
    --nhac-ink: #b7d6e6;
    --good: #3dbe74;
    --good-bg: #163226;
    --bad: #e06a5c;
    --bad-bg: #3a221e;
    --shadow: 0 0 0 1px rgba(255, 255, 255, .03);
    --serif: "Be Vietnam Pro", "Segoe UI", sans-serif;
    --sans: "Be Vietnam Pro", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; max-width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--bg);
    line-height: 1.45;
    height: 100%;
  }
  button, input, select { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type="checkbox"] { accent-color: var(--accent); }
  select { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .wrap {
    width: min(1180px, 100%); max-width: 1180px; height: 100%;
    margin: 0 auto; padding: 8px 14px 10px;
    display: flex; flex-direction: column; min-height: 0;
  }
  h1 {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 15px;
    line-height: 1;
    margin: 0;
    letter-spacing: .04em;
  }
  .topbar {
    display: flex; flex-wrap: nowrap; gap: 10px 14px;
    align-items: center; justify-content: space-between;
    margin: 0 0 8px; padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; gap: 2px; border-bottom: none; flex: 1; min-width: 0; }
  .tabs button {
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 6px 8px 8px; margin-bottom: 0;
    font-weight: 650; color: var(--soft); font-size: 13px;
    border-radius: 0;
  }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tempo { display: flex; flex-direction: column; gap: 2px; min-width: 132px; flex: none; }
  .tempo span { font-size: 12px; color: var(--soft); font-weight: 600; }
  .tempo strong { color: var(--ink); }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .switches { display: flex; flex-wrap: nowrap; gap: 8px 10px; margin: 0; flex: none; }
  #app { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  #app > .note-layout,
  #app > .sheet,
  #app > .practice-fit,
  #app > .breath-fit { flex: 1; min-height: 0; }
  .note-layout { height: 100%; overflow: hidden; }
  .note-main { min-height: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .note-staff { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .note-staff .score-scroll, .fit-score { flex: 1; min-height: 0; overflow: hidden; }
  .note-staff .score-scroll svg.staff { max-height: none; }
  .note-staff .foot-note { flex: none; margin: 4px 0 0; font-size: 12px; }
  .note-quiz-cta { margin-top: 4px; }
  .detail { flex: none; }
  .sheet { display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .sheet .now { min-height: 0; }
  .sheet .now strong { font-size: 22px; }
  .sheet .footwrap { height: 40px; }
  .sheet .foot svg { width: 84px; height: auto; }
  .sheet .lamps { margin-top: 2px; gap: 4px; }
  .sheet .lamps i { padding: 2px 1px; font-size: 11px; }
  .sheet .rhythm-top { flex: 1.15; min-height: 0; align-items: stretch; }
  .sheet .row { margin-top: 4px; }
  .sheet .demo-card { min-height: 0; display: flex; flex-direction: column; }
  .sheet .demo-card .score-scroll { flex: 1; min-height: 0; height: auto; overflow: hidden; }
  .sheet .finger-picks { margin-top: 4px; }
  .sheet .finger-picks .btn { padding: 4px 8px; font-size: 12px; }
  .sheet-rest .piece p { margin: 0; font-size: 12px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .sheet .demo-card .score-scroll svg { width: auto; height: auto; max-width: none; }
  .sheet .demo-card > p { display: none; }
  .sheet .rgrid { margin-top: 0; gap: 6px; grid-template-columns: repeat(7, minmax(0, 1fr)); min-width: 0; }
  .sheet .rcard { min-width: 0; padding: 6px 8px; }
  .sheet .rcard strong, .sheet .rcard em { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-rest { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .sheet-rest .finger-card { flex: none; }
  .sheet-rest .piece { flex: 1; min-height: 0; overflow: hidden; }
  .sheet-rest .piece .score-scroll { flex: 1; min-height: 0; overflow: hidden; }
  .practice-fit { display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .practice-fit > .card { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .practice-fit .score-scroll { flex: 1; min-height: 0; overflow: hidden; }
  .practice-fit > .card .score-scroll { flex: 0 1 auto; max-height: 340px; min-height: 0; overflow: hidden; align-items: center; justify-content: flex-start; }
  .practice-fit > .card .score-scroll svg.staff { max-height: none; width: auto; height: auto; }
  .practice-fit > .card .score-scroll.score-zoom { flex: 0 0 auto; max-height: 240px; width: 100%; overflow: hidden; justify-content: center; }
  .practice-fit > .card .score-scroll.score-zoom svg.staff { width: auto; height: 220px; max-width: 100%; }
  .practice-fit > .card .choices { overflow: visible; min-height: 0; flex: 0 0 auto; }
  .method-card { overflow: auto; }
  .method-list { margin: 8px 0 12px; padding-left: 0; list-style: none; display: grid; gap: 10px; }
  .method-list li { background: var(--raise); border-radius: 8px; padding: 10px 12px; }
  .method-list strong { display: block; margin-bottom: 4px; }
  .method-list span { color: var(--soft); }
  .practice-fit > .tap-layout { flex: 1; min-height: 0; height: auto; overflow: hidden; }
  .practice-fit .tap-layout > .card { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .practice-fit .tap-layout .score-scroll { flex: 1; min-height: 0; overflow: hidden; }
  .switches label {
    display: flex; gap: 6px; align-items: center;
    font-size: 12px; font-weight: 600; color: var(--soft); white-space: nowrap;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: none;
    padding: 10px 12px;
  }
  #app, .card, .piece, .pieces { min-width: 0; max-width: 100%; }
  .note-layout, .rhythm-top, .tap-layout, .read-layout {
    display: grid; gap: 16px; align-items: start;
    min-width: 0; max-width: 100%;
  }
  .note-layout { grid-template-columns: minmax(0, 1fr) minmax(240px, 320px); grid-template-rows: minmax(0, 1fr) auto; align-items: stretch; }
  .note-main { display: contents; }
  .note-staff { grid-column: 1; grid-row: 1 / span 2; }
  .note-layout > .ladder { grid-column: 2; grid-row: 1; overflow: hidden; }
  .detail { grid-column: 2; grid-row: 2; overflow: visible; }
  .rhythm-top { grid-template-columns: 260px minmax(0, 1fr); }
  .tap-layout { grid-template-columns: 1.35fr .8fr; }
  .note-main, .note-layout > .ladder { height: 100%; min-height: 0; }
  .note-layout > .ladder { overflow: auto; }
  .practice-fit > .tap-layout { align-items: stretch; }
  .sheet-rest .pieces { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .sheet .piece-tabs { margin: 4px 0; }
  .sheet .foot-note { margin: 0; font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sheet .pane-tabs { flex: none; margin: 0; }
  .sheet .piece-tabs .btn { padding: 5px 10px; font-size: 13px; white-space: nowrap; }
  .sheet .nums { flex-wrap: nowrap; overflow-x: auto; }
  .sheet-rest.songs-mode .piece-tabs.nums { flex: 0 0 auto; flex-wrap: wrap; overflow: visible; }
  .sheet > .nhip-pane { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 6px; }
  .sheet > .lo-pane { flex: 1; min-height: 0; overflow: auto; }
  .sheet .piece-blurb { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .line-switch { display: flex; flex-wrap: wrap; gap: 6px; flex: none; }
  .line-switch .btn { padding: 4px 8px; font-size: 12px; }
  .score-scroll { overflow: hidden; max-width: 100%; min-width: 0; padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: var(--paper); border-radius: 6px; }
  .score-scroll svg.staff { width: auto; height: auto; max-width: none; flex: none; display: block; }
  .score-scroll svg.staff[hidden] { display: none; }
  .ladder { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); grid-auto-columns: minmax(0, 1fr); gap: 4px; align-content: start; }
  .ladder-btn {
    display: flex; gap: 6px; align-items: center; width: 100%; min-width: 0;
    text-align: left; background: transparent; border: 1px solid transparent;
    border-radius: 6px; padding: 4px 6px;
  }
  .ladder-btn.on { background: var(--raise); border-color: var(--accent); box-shadow: none; }
  .ladder-btn strong { display: block; font-size: 14px; }
  .ladder-btn small { display: block; color: var(--soft); font-weight: 600; font-size: 11px; line-height: 1.2; }
  .ladder-btn .sure { margin-left: auto; font-style: normal; font-size: 11px; font-weight: 700; color: var(--good); }
  .ladder-btn .swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .mini i { position: absolute; left: 0; right: 0; height: 1.5px; background: currentColor; opacity: .4; }
  .mini i.ledger { left: 7px; right: 7px; opacity: .75; }
  .mini b {
    position: absolute; left: 6px; width: 10px; height: 7px; margin-top: -3px;
    border-radius: 50%; background: var(--c, var(--ink)); transform: rotate(-18deg);
  }
  .detail h2 { font-family: var(--sans); font-weight: 700; font-size: 26px; margin: 0 0 4px; }
  .detail .aka { color: var(--soft); font-weight: 600; }
  .detail .where { font-weight: 700; color: var(--accent-ink); margin: 8px 0; }
  .mnemonic { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .mnemonic p { margin: 0; }
  .mnemonic b.hit { color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn {
    border: 1px solid var(--line); background: var(--raise); color: var(--ink); border-radius: 6px;
    padding: 8px 12px; font-weight: 700; font-size: 14px;
  }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn.on { border-color: var(--accent); color: var(--accent); }
  .stage { text-align: center; }
  .now { min-height: 92px; }
  .now span { display: block; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  .now strong {
    font-family: var(--sans); font-weight: 700; font-size: 44px; line-height: 1;
    letter-spacing: 0; display: block;
  }
  .stage.dap .now strong { color: var(--accent); }
  .stage.nhac .now strong { color: var(--nhac); }
  .stage.assist-off .now, .stage.assist-off .lamps { visibility: hidden; }
  .footwrap { height: 96px; display: flex; align-items: flex-end; justify-content: center; }
  .foot { transform-origin: 75% 80%; transition: transform .09s ease-out; transform: translateY(-18px) rotate(-16deg); }
  .stage.dap .foot { transform: translateY(14px) rotate(7deg); }
  .stage.dap-up .foot { transform: translateY(-12px) rotate(-10deg); }
  .stage.nhac .foot { transform: translateY(-18px) rotate(-16deg); }
  .stage.assist-off .foot { transform: none; }
  .ground { height: 2px; margin: 0 24px; background: #6d665c; border-radius: 2px; position: relative; }
  .ground.stamp::after {
    content: ""; position: absolute; left: 50%; top: -6px; width: 16px; height: 8px;
    margin-left: -8px; border-radius: 50%; background: rgba(198, 83, 36, .35);
    animation: puff .35s ease-out forwards;
  }
  @keyframes puff { from { transform: scale(.4); opacity: .8; } to { transform: scale(1.8); opacity: 0; } }
  .lamps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .lamps i {
    font-style: normal; text-align: center; border-radius: 6px;
    background: var(--raise); color: var(--soft); padding: 8px 2px; font-weight: 800; font-size: 13px;
  }
  .lamps i b { display: block; font-size: 11px; font-weight: 700; opacity: .7; }
  .lamps i .lamp-up { display: none; }
  .lamps i.on.m-dap { background: var(--accent); color: white; }
  .lamps i.on.m-nhac { background: var(--nhac); color: white; }
  .lamps i.phase-up { background: var(--nhac); color: white; }
  .lamps i.phase-up .lamp-down { display: none; }
  .lamps i.phase-up .lamp-up { display: inline; }
  .rgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .rcard {
    text-align: left; background: var(--raise); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 12px; box-shadow: none;
  }
  .rcard.on { border-color: var(--accent); box-shadow: none; }
  .rcard strong { display: block; font-size: 15px; }
  .rcard em { font-style: normal; color: var(--soft); font-weight: 600; font-size: 13px; }
  .pieces { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .piece-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .piece-tabs.nums { flex-wrap: nowrap; overflow-x: auto; }
  .piece-tabs .btn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .group-title { margin: 18px 0 0; font-size: 18px; }
  .piece {
    display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--raise);
  }
  .piece-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .piece p { margin: 4px 0 0; color: var(--soft); font-size: 13px; }
  .line-acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .line-report { flex-basis: 100%; margin: 2px 0 0; font-size: 14px; font-weight: 650; }
  .line-report ul { margin: 6px 0 0; padding-left: 18px; font-weight: 650; }
  .line-report li { margin: 3px 0; }
  .line-report .ok { color: var(--good); }
  .line-report .miss { color: var(--bad); }
  .line-report .live-word { font-family: var(--sans); font-size: 28px; line-height: 1.1; margin: 0; font-weight: 700; }
  .finger-card { min-width: 0; }
  .finger-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
  .finger-head strong { font-family: var(--sans); font-size: 20px; font-weight: 700; line-height: 1; }
  .finger-head span { color: var(--soft); font-weight: 650; font-size: 13px; }
  .flute {
    display: grid;
    grid-template-columns: auto repeat(10, minmax(0, 1fr)) auto;
    gap: 2px;
    align-items: start;
    overflow: hidden;
    padding: 8px 8px 4px;
    min-width: 0;
    background: var(--paper);
    border-radius: 6px;
  }
  .mouth-mark { font-size: 10px; font-weight: 800; color: #5c564e; padding-top: 6px; }
  .hole { width: auto; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .hole i {
    width: 22px; height: 22px; border-radius: 50%; background: #241c16;
    box-shadow: inset 0 0 0 2px #241c16; display: block; margin: 2px 0;
  }
  .hole.small i, .hole.under i { width: 12px; height: 12px; }
  .hole.small i { transform: translateY(-3px); }
  .hole.under i { transform: translateY(4px); }
  .finger-brief .hole b, .finger-brief .hole small { display: none; }
  .finger-brief .flute { align-items: center; padding: 6px 0 2px; }
  .finger-brief .mouth-mark { padding-top: 0; }
  .finger-brief .hole.small i, .finger-brief .hole.under i { transform: none; }
  .hole.open i { background: #fff; }
  .hole.half i { background: linear-gradient(90deg, #241c16 52%, #fff 52%); }
  .hole b { color: #241c16; }
  .hole small { color: #62584e; }
  .hole b, .hole small { display: block; max-width: 100%; overflow-wrap: anywhere; font-size: 10px; line-height: 1.15; text-align: center; font-weight: 700; }
  .hole.open small, .hole.half small { color: #8d5a16; }
  .finger-picks .btn { padding: 6px 10px; }
  .finger-strip { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 8px; }
  .finger-strip b { font-size: 13px; margin-right: 4px; }
  .finger-strip i {
    width: 14px; height: 14px; border-radius: 50%; background: #070605;
    box-shadow: inset 0 0 0 1.5px #efeae0; display: block;
  }
  .finger-strip i.dot-small { width: 10px; height: 10px; }
  .finger-strip i.open { background: #fff; }
  .finger-strip i.half { background: linear-gradient(90deg, #070605 52%, #fff 52%); }
  .finger-mini { margin: 4px 0 0; color: var(--soft); font-size: 13px; font-weight: 650; }
  .system.live-line .staff-line { stroke: var(--accent); }
  .note.mark-bad .head, .note.hearing-bad .head { fill: var(--bad); }
  .note.mark-good .head, .note.hearing-good .head { fill: var(--good); }
  .note.head-open.mark-bad .head { fill: #fff7f2; stroke: var(--bad); stroke-width: 2.4; }
  .note.head-open.mark-good .head { fill: #f3fbf6; stroke: var(--good); stroke-width: 2.4; }
  .note.mark-empty .head { fill: transparent; stroke: #8a8175; stroke-width: 1.8; }
  .note.mark-bad { cursor: pointer; }
  .practice-fit > .card.pair-card .score-scroll { max-height: none; flex: 1 1 auto; }
  .badge { font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--accent-ink); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 6px; margin-top: 8px; }
  .choices button {
    text-align: left; background: var(--raise); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; font-weight: 700; font-size: 14px;
  }
  .choices button.correct { background: var(--good-bg); border-color: var(--good); }
  .choices button.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .choices.locked button { pointer-events: none; }
  .feedback { min-height: 1.4em; font-weight: 700; margin: 10px 0 0; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .progress { color: var(--soft); font-weight: 700; font-size: 13px; margin: 0 0 8px; }
  .pads { display: grid; gap: 8px; margin-top: 8px; }
  .pad {
    border-radius: 8px; border: 1px solid var(--line); min-height: 84px;
    font-weight: 800; font-size: 22px; letter-spacing: .04em;
  }
  .pad small { display: block; font-weight: 650; font-size: 12px; letter-spacing: 0; opacity: .8; }
  .pad.dap { background: #3a2a1c; color: var(--accent-ink); }
  .pad.nhac { background: #1a2c36; color: var(--nhac-ink); }
  .pad.due.dap { background: var(--accent); color: white; }
  .pad.due.nhac { background: var(--nhac); color: white; }
  .pad.flash-good { box-shadow: inset 0 0 0 3px var(--good); }
  .pad.flash-bad { box-shadow: inset 0 0 0 3px var(--bad); }
  .live { font-weight: 800; min-height: 1.4em; margin: 8px 0; }
  .keys { color: var(--soft); font-size: 13px; margin: 8px 0 0; }
  .sum { font-family: var(--sans); font-weight: 700; font-size: 28px; margin: 0 0 8px; }
  .shake { animation: shake .35s ease; }
  @keyframes shake {
    20% { transform: translateX(-4px); } 40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); } 80% { transform: translateX(2px); }
  }
  .toast {
    position: fixed; bottom: 18px; left: 50%; z-index: 5;
    transform: translateX(-50%) translateY(10px);
    background: var(--raise); color: var(--ink); padding: 10px 14px; border-radius: 6px;
    border: 1px solid var(--line);
    font-weight: 700; opacity: 0; pointer-events: none; transition: .18s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.good { background: var(--good); }
  .toast.bad { background: var(--bad); }
  .foot-note { color: var(--soft); font-size: 14px; }
  .breath-fit { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }

        const yEnd = n.cy + (stemUp ? -step * 3.35 : step * 3.35);
        parts.push(`<line x1="${sx}" y1="${n.cy}" x2="${sx}" y2="${yEnd}" stroke="#241c16" stroke-width="1.7"/>`);
        if (n.kind === "e") flag(parts, sx, yEnd, stemUp);
      }
      if (n.kind === "dh" || n.kind === "dq") {
        const onLine = n.pos % 2 === 0;
        const dy = onLine ? n.cy - step * 0.55 : n.cy;
        parts.push(`<circle cx="${n.cx + rx + step * 0.45}" cy="${dy}" r="${Math.max(2.4, step * 0.16)}" fill="#241c16"/>`);
      }
      if (n.orn) {
        const ly = stemUp ? n.cy - step * 3.7 : n.cy + step * 4.1;
        parts.push(`<text x="${n.cx}" y="${ly}" text-anchor="middle" font-family="Be Vietnam Pro, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8d3414">${ornName(n)}</text>`);
      }
      parts.push(`</g>`);
      if (opt.map) {
        const nameY = y(-2) + Math.round(step * 1.7);
        parts.push(`<text class="map-label" x="${n.cx}" y="${nameY}" text-anchor="middle" font-size="${Math.round(step * 0.72)}" fill="${COLORS[n.id]}" data-act="pick-note" data-id="${n.id}">${esc(n.name)}</text>`);
      }
    });
    slurGroups(laid.items).forEach((g) => {
      const here = g.filter((n) => n.start >= sys.from && n.start < sys.to);
      if (here.length > 1) drawSlur(parts, here);
    });
    if (showLane) {
      const plan = beatPlan(notes);
      const beat0 = sys.from / 2;
      if (showFoot) for (let b = 0; b < beats; b++) {
        const x = left + b * beatW;
        const global = beat0 + b;
        const stepPlan = plan[global] || { motion: "dap", tongue: false };
        const cls = stepPlan.motion === "nhac" ? "nhac" : "dap";
        const label = stepPlan.motion === "nhac" ? "Nhấc" : "Đập";
        parts.push(`<rect class="bcell ${cls}" data-beat="${global}" x="${x + 3}" y="${y0 + laneY}" width="${beatW - 6}" height="32" rx="8"/>`);
        parts.push(`<text class="lane-label" x="${x + beatW / 2}" y="${y0 + laneY + 21}" text-anchor="middle" font-family="Be Vietnam Pro, Segoe UI, sans-serif" font-size="${laneSize}" font-weight="700" fill="#241c16">${label}</text>`);
      }
      if (showTongue) items.forEach((n) => {
        const x = left + (n.start - sys.from) * eighthW + 3;
        const w = Math.max(8, n.e * eighthW - 6);
        const luyen = n.art === "luyen";
        const word = luyen ? "Luyến" : "Lưỡi";
        parts.push(`<rect class="nbar ${luyen ? "luyen" : "luoi"}" data-start="${n.start}" data-len="${n.e}" x="${x}" y="${y0 + laneY + 40}" width="${w}" height="24" rx="7"/>`);
        if (w > 78) {
          parts.push(`<text x="${x + w / 2}" y="${y0 + laneY + 56}" text-anchor="middle" font-family="Be Vietnam Pro, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#fff">${word} · ${esc(n.name)}</text>`);
        } else if (w > 42) {
          parts.push(`<text x="${x + w / 2}" y="${y0 + laneY + 56}" text-anchor="middle" font-family="Be Vietnam Pro, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#fff">${word}</text>`);
        }
      });
      if (showTongue) slurGroups(laid.items).forEach((g) => {
        const here = g.filter((n) => n.start >= sys.from && n.start < sys.to);
        if (here.length < 2) return;
        if (here.every((n) => n.e * eighthW - 6 > 42)) return;
        const last = here[here.length - 1];
        const x1 = left + (here[0].start - sys.from) * eighthW;
        const x2 = left + (last.start - sys.from + last.e) * eighthW;
        parts.push(`<text x="${(x1 + x2) / 2}" y="${y0 + laneY + (showFoot ? 80 : 40)}" text-anchor="middle" font-family="Be Vietnam Pro, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#14485c">Lưỡi nốt đầu, sau đó luyến</text>`);
      });
      const railW = Math.max(0, beats * beatW);
      const railY = y0 + laneY + (showTongue ? (showFoot ? 90 : 50) : 38);
      if (showFoot || showTongue) {
        parts.push(`<rect class="time-rail" x="${left}" y="${railY}" width="${railW}" height="8" rx="4"/>`);
        parts.push(`<rect class="time-fill" x="${left}" y="${railY}" width="0" height="8" rx="4"/>`);
      }
    }
    const headTop = y(8) - 12;
    const headBottom = showLane ? y0 + laneY + 100 : y(0) + 8;
    parts.push(`<line class="playhead" x1="-20" y1="${headTop}" x2="-20" y2="${headBottom}" opacity="0"/>`);
    parts.push(`</g></svg>`);
  });
  const html = parts.join("");
  return { html, left, beatW, totalBeats: laid.totalBeats };
}

function ledgers(pos) {
  const lines = [];
  if (pos <= -2) {
    for (let p = -2; p >= (pos % 2 === 0 ? pos : pos - 1); p -= 2) lines.push(p);
  }
  if (pos >= 10) {
    for (let p = 10; p <= (pos % 2 === 0 ? pos : pos + 1); p += 2) lines.push(p);
  }
  return lines;
}
function slurGroups(items) {
  const out = [];
  for (let i = 0; i < items.length; i++) {
    if (items[i].art === "luyen") continue;
    const g = [items[i]];
    let j = i + 1;
    while (j < items.length && items[j].art === "luyen") g.push(items[j++]);
    if (g.length > 1) out.push(g);
  }
  return out;
}
function drawSlur(parts, group) {
  const x1 = group[0].cx - 6;
  const x2 = group[group.length - 1].cx + 12;
  const top = Math.min.apply(null, group.map((n) => n.cy));
  const bot = Math.max.apply(null, group.map((n) => n.cy));
  let y = top - 28;
  let bend = -18;
  if (y < 16) { y = bot + 32; bend = 18; }
  const mid = (x1 + x2) / 2;
  parts.push(`<path class="slur" d="M ${x1} ${y} Q ${mid} ${y + bend} ${x2} ${y}"/>`);
}
function eighthGroups(items, beatEighths) {
  const beat = beatEighths || 2;
  const groups = [];
  let run = [];
  const flush = () => { if (run.length > 1) groups.push(run); run = []; };
  items.forEach((it) => {
    const sameBeat = run.length && Math.floor(it.start / beat) === Math.floor(run[0].start / beat) && Math.abs(it.start - (run[run.length - 1].start + run[run.length - 1].e)) < 0.01;
    if (it.kind === "e" && (run.length === 0 || sameBeat)) run.push(it);
    else { flush(); if (it.kind === "e") run = [it]; }
  });
  flush();
  return groups;
}
function averagePos(group) {
  return group.reduce((s, n) => s + n.pos, 0) / group.length;
}
function drawBeam(parts, group, step) {
  if (group.length < 2) return;
  const up = averagePos(group) < 4;
  const len = step * 3.35;
  const rx = 0.92 * step;
  const xs = group.map((g) => g.cx + (up ? rx * 0.86 : -rx * 0.86));
  const ys = group.map((g) => g.cy + (up ? -len : len));
  const thick = (up ? 1 : -1) * Math.max(3.4, step * 0.2);
  const x1 = xs[0];
  const y1 = ys[0];
  const x2 = xs[xs.length - 1];
  const y2 = ys[ys.length - 1];
  parts.push(`<path d="M ${x1} ${y1} L ${x2} ${y2} L ${x2} ${y2 + thick} L ${x1} ${y1 + thick} Z" fill="#241c16"/>`);
  group.forEach((g, i) => {
    parts.push(`<line x1="${xs[i]}" y1="${g.cy}" x2="${xs[i]}" y2="${ys[i]}" stroke="#241c16" stroke-width="1.7"/>`);
  });
}
function flag(parts, x, y, up) {

    : `M ${x} ${y} C ${x + 14} ${y - 8}, ${x + 16} ${y - 22}, ${x + 3} ${y - 28}`;
  parts.push(`<path d="${d}" fill="none" stroke="#241c16" stroke-width="2" stroke-linecap="round"/>`);
}

  Bb4: "Si giáng quãng 1: mở ngón trỏ trái và ngón áp út phải, bịt bốn lỗ giữa. Thế 0xxxx0 của sáo Đô.",
  B4: "Mở cả sáu lỗ chính. Bốn lỗ nhỏ vẫn bịt."
};
function fingerIdOf(note) {
  if (!note) return "C4";
  return PC_ID[((note.midi % 12) + 12) % 12];
}
function registerOf(note) {
  if (!note) return 1;
  if (note.oct) return note.oct;
  if (note.midi >= 96) return 3;
  if (note.midi >= 84) return 2;
  return 1;
}
function holeState(note) {
  const id = fingerIdOf(note);
  const reg = registerOf(note);
  const high = reg >= 2;
  if (id === "Bb4" && reg >= 2) {
    return {
      id, high, reg,
      open: ["li", "lr", "ri", "rm", "rr"],
      half: [],
      hint: "Si giáng cao độ " + reg + ": chỉ bịt ngón giữa trái, lỗ La. Các lỗ chính khác mở."
    };
  }
  const lowName = (noteById(id) || {}).name || "";
  let hint = FINGER_HINT[id] || "";
  if (reg === 2) hint = "Cao độ 2, cùng thế ngón với " + lowName + ". Hơi mạnh và hẹp hơn cao độ 1. Không mở thêm lỗ.";
  else if (reg === 3) hint = "Cao độ 3, cùng thế ngón với " + lowName + ". Hơi nhanh hơn cao độ 2: môi khít, tia hơi hất lên mép lỗ thổi. Không mở thêm lỗ.";
  return { id, high, reg, open: OPEN_HOLES[id] || [], half: HALF_HOLES[id] || [], hint };
}
function noteIdForReg(reg, pc) {
  const row = REG_NOTES[reg] || REG_NOTES[1];
  const hit = row.find((pid) => ((noteById(pid).midi % 12) + 12) % 12 === pc);
  if (hit) return hit;
  let best = row[0];
  let dist = 99;
  row.forEach((pid) => {
    const p = ((noteById(pid).midi % 12) + 12) % 12;
    const d = Math.min((p - pc + 12) % 12, (pc - p + 12) % 12);
    if (d < dist) { dist = d; best = pid; }
  });
  return best;
}
function fingerPickButtons(reg, currentId) {
  return (REG_NOTES[reg] || REG_NOTES[1]).map((pid) => {
    const n = noteById(pid);
    return `<button type="button" class="btn ${pid === currentId ? "on" : ""}" data-act="show-finger" data-id="${pid}">${esc(n.name)}</button>`;
  }).join("");
}
function fingerRegButtons(reg) {
  return [1, 2, 3].map((r) => `<button type="button" class="btn ${r === reg ? "on" : ""}" data-act="finger-reg" data-reg="${r}">Cao độ ${r}</button>`).join("");
}
function fingerFoot(reg) {
  if (reg === 3) return "Cao độ 3 chỉ tới Son 3. Giữ đúng thế ngón của nốt thấp, rồi thổi hơi nhanh hơn cao độ 2. Lỗ đậm là bịt, lỗ trắng là mở.";
  if (reg === 2) return "Cao độ 2 dùng đúng thế ngón cao độ 1. Hơi mạnh và hẹp hơn thì nốt nhảy lên. Lỗ đậm là bịt, lỗ trắng là mở.";
  return "Từ miệng sang đuôi: Si, La, Son thăng, Son, Fa thăng, Fa, Mi, Rê thăng, Rê, Đồ thăng. Lỗ đậm là bịt, lỗ trắng là mở.";
}
function fingerMarkup(note, brief) {
  const st = holeState(note);
  const holes = HOLES.map((h) => {
    const cls = ["hole", h.kind, st.open.indexOf(h.id) >= 0 ? "open" : "", st.half.indexOf(h.id) >= 0 ? "half" : ""].filter(Boolean).join(" ");
    const word = st.half.indexOf(h.id) >= 0 ? "nửa" : st.open.indexOf(h.id) >= 0 ? "mở" : "bịt";
    const label = brief ? "" : `<b>${esc(h.finger)}</b><small>${esc(h.job)}</small>`;
    return `<div class="${cls}" data-hole="${h.id}" title="${esc(h.finger + " · " + h.job + " · " + word)}"><i></i>${label}</div>`;
  }).join("");
  const tube = `<div class="flute"><div class="mouth-mark">miệng</div>${holes}<div class="mouth-mark">đuôi</div></div>`;
  const picks = fingerPickButtons(registerOf(note), note.id);
  if (brief === true || brief === "picks") {
    const row = brief === "picks" ? `<div class="row finger-picks">${picks}</div>` : "";
    return `<div class="finger-card finger-brief" id="fingerCard" data-finger="${st.id}" data-reg="${st.reg}" data-high="${st.high ? "1" : "0"}">
      ${tube}
      <p class="finger-mini" id="fingerHint">${esc(st.hint)}</p>
      ${row}
    </div>`;
  }
  const reg = registerOf(note);
  return `<div class="finger-card" id="fingerCard" data-finger="${st.id}" data-reg="${st.reg}" data-high="${st.high ? "1" : "0"}">
    <div class="finger-head"><strong id="fingerName">${esc(note.name)}</strong><span id="fingerHint">${esc(st.hint)}</span></div>
    ${tube}
    <div class="row finger-regs">${fingerRegButtons(reg)}</div>
    <div class="row finger-picks">${fingerPickButtons(reg, note.id)}</div>
    <p class="foot-note">${esc(fingerFoot(reg))}</p>
  </div>`;
}
function paintFingers(note) {
  const root = document.getElementById("fingerCard");
  if (!root || !note) return;
  const st = holeState(note);
  const reg = String(st.reg);
  if (root.dataset.finger === st.id && root.dataset.reg === reg) return;
  root.dataset.finger = st.id;
  root.dataset.reg = reg;
  root.dataset.high = st.high ? "1" : "0";
  root.querySelectorAll("[data-hole]").forEach((el) => {
    const hid = el.dataset.hole;
    const hole = HOLES.find((h) => h.id === hid);
    const isOpen = st.open.indexOf(hid) >= 0;
    const isHalf = st.half.indexOf(hid) >= 0;
    el.classList.toggle("open", isOpen);
    el.classList.toggle("half", isHalf);
    const small = el.querySelector("small");
    if (small && hole) small.textContent = hole.job;
  });
  const nameEl = document.getElementById("fingerName");
  if (nameEl) nameEl.textContent = note.name;
  const hint = document.getElementById("fingerHint");
  if (hint) hint.textContent = st.hint;
  root.querySelectorAll("[data-act='show-finger']").forEach((b) => b.classList.toggle("on", b.dataset.id === note.id));
}
function fingerStrip(note) {
  if (!note) return "";
  const st = holeState(note);
  const dots = HOLES.map((h) => {
    const cls = (st.half.indexOf(h.id) >= 0 ? "half" : st.open.indexOf(h.id) >= 0 ? "open" : "shut") + (h.kind === "main" ? "" : " dot-small");
    return `<i class="${cls}" title="${esc(h.finger + " · " + h.job)}"></i>`;
  }).join("");
  return `<div class="finger-strip"><b>${esc(note.name)}</b>${dots}</div><p class="finger-mini">${esc(st.hint)}</p>`;
}

        ${previewScore(resolve(piece.seq), piece.id, shelf.id === "songs")}
        ${linePracticeBar(resolve(piece.seq), piece.id)}
      </div></div>
    </div>`;
  }
  return `<div class="sheet ${pane === "bai" && state.shelf === "songs" ? "songs-mode" : ""}"><div class="piece-tabs pane-tabs">${paneTabs}</div>${body}</div>`;
}

function makeQuiz() {
  const scale = state.practice === "name" ? focusNotes() : activeNotes();
  const level = state.level;
  const items = [];
  if (state.practice === "mixed") {
    // Hai lượt xáo không lặp trong mỗi lượt; 30 câu luôn có đủ cả 19 nốt.
    const pool = NOTES;
    const deck = [...shuffle(pool), ...shuffle(pool)].slice(0, 30);
    deck.forEach((note) => {
      const sameName = pool.filter((n) => n.id !== note.id && n.midi % 12 === note.midi % 12);
      const others = shuffle(pool.filter((n) => n.id !== note.id && n.midi % 12 !== note.midi % 12));
      const options = [note, ...sameName, ...others].slice(0, 4);
      const label = (n) => `${n.name.replace(/ [23]$/, "")} · quãng ${noteRegOf(n)}`;
      items.push({ notes: [{ ...note, e: 2 }], prompt: "Nốt gì, thuộc quãng nào?",
        answer: note.id, choices: shuffle(options.map((n) => ({ id: n.id, label: label(n) }))),
        explain: `Đáp án: ${label(note)}. ${PLACE[note.id]?.[0] || ""}.`,
        noteId: note.id, hear: note.midi });
    });
  } else if (state.practice === "name") {
    const pool = scale;
    const choices = shuffle(pool.map((n) => ({ id: n.id, label: n.name })));
    for (let i = 0; i < 30; i++) {
      const note = pool[Math.floor(Math.random() * pool.length)];
      const place = PLACE[note.id] ? PLACE[note.id][0] : "";
      items.push({
        notes: [{ ...note, e: 2 }],
        prompt: "Nốt trên khuông tên là gì?",
        answer: note.id,
        choices,
        explain: `Đây là nốt ${note.name}. ${place}.`,
        noteId: note.id,
        hear: note.midi
      });
    }
  } else if (state.practice === "value") {
    const bank = valueBank().filter((q) => q.level <= level);
    for (let i = 0; i < 30; i++) {
      const q = bank[Math.floor(Math.random() * bank.length)];
      const pitch = scale[Math.floor(Math.random() * Math.min(6, scale.length))];
      const notes = q.e.map((e, idx) => ({ ...scale[Math.min(scale.length - 1, scale.indexOf(pitch) + idx)], e }));
      const pool = shuffle(bank.filter((b) => b.answer !== q.answer)).slice(0, 3).map((b) => b.answer);
      items.push({
        notes,
        prompt: q.prompt,
        answer: q.answer,
        choices: shuffle([q.answer, ...pool].map((label) => ({ id: label, label }))),
        explain: "Chưa phải. Đáp án: " + q.answer + ".",
        hear: pitch.midi
      });
    }
  } else if (state.practice === "read") {
    for (let i = 0; i < 30; i++) {
      const pat = PATTERNS[level][Math.floor(Math.random() * PATTERNS[level].length)];
      const notes = melodyFrom(pat, scale);
      const focus = Math.floor(Math.random() * notes.length);
      const n = notes[focus];
      const askName = Math.random() < 0.55;
      if (askName) {
        items.push({
          notes, hot: focus,
          prompt: "Nốt đang khoanh tên là gì?",
          answer: n.id,
          choices: shuffle(scale.map((x) => ({ id: x.id, label: x.name }))),
          explain: `Nốt đang khoanh là ${n.name}. ${PLACE[n.id][0]}.`,
          noteId: n.id,
          hear: n.midi
        });
      } else {
        const answer = phraseOf(n.e);
        const pool = shuffle(RHYTHMS.map((r) => phraseOf(r.e)).filter((p) => p !== answer)).slice(0, 3);
        items.push({
          notes, hot: focus,
          prompt: "Nốt đang khoanh dài bao lâu?",
          answer,
          choices: shuffle([answer, ...pool].map((label) => ({ id: label, label }))),
          explain: "Nốt này dài " + answer + ". Nốt đen là 1 phách, nốt trắng là 2 phách. Đánh lưỡi khi nốt bắt đầu, rồi giữ hơi cho hết độ dài đó.",
          hear: n.midi
        });
      }
    }
  }
  return { mode: state.practice, level, reg: state.noteReg, items, index: 0, locked: false };
}
function phraseOf(e) {
  if (e >= 8) return "4 phách";
  if (e === 6) return "3 phách";
  if (e === 4) return "2 phách";
  if (e === 3) return "1½ phách";
  if (e === 2) return "1 phách";
  return "½ phách";
}
function valueBank() {
  return [
    { level: 1, e: [2], prompt: "Nốt đen này dài bao lâu?", answer: "1 phách" },
    { level: 1, e: [4], prompt: "Nốt trắng này dài bao lâu?", answer: "2 phách" },
    { level: 1, e: [8], prompt: "Nốt tròn này dài bao lâu?", answer: "4 phách" },
    { level: 2, e: [6], prompt: "Nốt trắng chấm này dài bao lâu?", answer: "3 phách" },
    { level: 2, e: [1, 1], prompt: "Hai nốt móc đơn này bằng bao lâu?", answer: "1 phách" },
    { level: 3, e: [3], prompt: "Nốt đen chấm này dài bao lâu?", answer: "1½ phách" },
    { level: 3, e: [3, 1], prompt: "Đen chấm cộng nốt móc bằng bao lâu?", answer: "2 phách" }
  ];
}
function melodyFrom(pattern, scale) {
  let idx = [0, 2, Math.min(4, scale.length - 1)][Math.floor(Math.random() * 3)] % scale.length;
  const steps = [0, 1, -1, 1, -1, 2, -2];
  return pattern.map((e) => {
    const note = { ...scale[idx], e };
    idx = Math.max(0, Math.min(scale.length - 1, idx + steps[Math.floor(Math.random() * steps.length)]));
    return note;
  });
}

function paintPractice() {
  const levels = [1, 2, 3].map((n) => `<button type="button" class="btn ${state.level === n ? "on" : ""}" data-act="level" data-level="${n}">${n === 1 ? "Dễ" : n === 2 ? "Vừa" : "Khá"}</button>`).join("");
  const modes = [
    ["method", "Cách luyện"],
    ["name", "Nhận diện nốt"],
    ["mixed", "Trộn quãng 1–2–3"],
    ["ear", "Luyện tai"],
    ["coach", "Nghe & thổi / Đổi nốt"],
    ["value", "Nhận phách"],
    ["read", "Đọc ô nhịp"],
    ["tap", "Đập chân"],
    ["doi", "Đổi ngón"]
  ].map(([id, label]) => `<button type="button" class="btn ${state.practice === id ? "primary" : ""}" data-act="practice" data-mode="${id}">${label}</button>`).join("");
  let body = "";

  else {

  const levelRow = state.practice === "tap" || state.practice === "doi" || state.practice === "method" || state.practice === "mixed" || state.practice === "ear" || state.practice === "coach" ? "" : `<div class="seg">${levels}</div>`;
  const regRow = state.practice === "name" ? noteRegButtons() : state.practice === "mixed" ? `<p>30 câu trộn quãng 1, 2, 3 · Đồ 1–Son 3 theo bộ nốt hiện có. Chọn đúng cả tên và quãng; không cần bật “Hiện cao độ 2 và 3”.</p>` : "";
  const songPractice = state.practice === "tap" && SONG_LIBRARY.some((song) => song.id === state.tapPiece);

}

function yinPitch(buf, sampleRate) {

function lineOnsets(samples) {

      out.push(s);
      lastT = s.t;
    }

function gradeLine(notes, fromE, toE, samples, beatDur) {

  const items = layout(notes).items.filter((n) => n.start >= fromE && n.start < toE);
  const markOf = (n, kind) => ({

    sound: n.midi + 12,

  if (loud < 0.02) {

  }
  const measured = measurePhrase(notes, fromE, toE, samples, beatDur, 0);
  const onsets = lineOnsets(samples);
  const used = new Set();
  const comments = [];
  const marks = [];
  let ok = 0;
  items.forEach((n) => {
    const start = (n.start - fromE) / 2 * beatDur;
    const dur = Math.max(0.12, (n.e / 2) * beatDur);
    const win = Math.min(0.18, Math.max(0.09, dur * 0.42));
    const tight = Math.min(0.12, win * 0.72);
    const tongue = n.art !== "luyen";
    let onset = null;
    let best = win;
    let onsetIndex = -1;
    onsets.forEach((s, i) => {
      if (used.has(i)) return;
      const d = Math.abs(s.t - start);
      if (d <= best) { best = d; onset = s; onsetIndex = i; }
    });
    if (onsetIndex >= 0) used.add(onsetIndex);
    const body = samples.filter((s) => s.hz > 0 && s.t >= start + dur * 0.2 && s.t <= start + dur * 0.85);
    let pitch = "silent";
    let heard = "";
    if (body.length >= 2) {
      const hz = median(body.map((s) => s.hz));
      if (flutePitchOk(hz, n.midi)) pitch = "ok";
      else { pitch = "wrong"; heard = solfeFromHz(hz); }
    }
    const problems = [];
    if (tongue) {
      if (!onset) problems.push("chưa thấy rõ lúc tách tiếng");
      else if (onset.t < start - tight) problems.push("đánh lưỡi sớm");
      else if (onset.t > start + tight) problems.push("đánh lưỡi trễ");
    } else if (onset) {

    }
    else if (pitch === "wrong") problems.push("thổi thành " + heard + ", bài là " + n.name);

async function playTake(url) {

  engine.stop();
  let audioBuf;
  try {
    const res = await fetch(url);

  const g = ctx.createGain();

  const ch = audioBuf.getChannelData(0);
  for (let i = 0; i < ch.length; i += 32) peak = Math.max(peak, Math.abs(ch[i]));

  g.connect(ctx.destination);

  stopQuizListen();
  stopBreathListen();
  const pair = FINGER_PAIRS[state.pair] || FINGER_PAIRS[0];
  const notes = pairNotes(pair);
  const verdict = document.getElementById("pairVerdict");
  if (!window.isSecureContext || !navigator.mediaDevices) {
    if (verdict) verdict.textContent = "Mic cần http://localhost:8753.";
    return;
  }
  const token = ++pairListen.token;
  let stream;
  try { stream = await openMic(); }
  catch (err) {
    if (verdict) verdict.textContent = "Trình duyệt chưa cho dùng mic.";
    return;
  }
  if (token !== pairListen.token) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  if (ctx.state === "suspended") await ctx.resume();
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0;
  ctx.createMediaStreamSource(stream).connect(analyser);
  pairListen.on = true;
  pairListen.stream = stream;
  pairListen.ctx = ctx;
  pairListen.analyser = analyser;
  pairListen.buf = new Float32Array(analyser.fftSize);
  const btn = document.getElementById("pairMic");
  if (btn) btn.textContent = "Dừng";
  const beat = 60 / 48;
  const origin = ctx.currentTime + 0.08 + 5 * beat;
  for (let i = 0; i < 4; i++) tick(ctx, ctx.currentTime + 0.08 + (1 + i) * beat, i % 2 === 0);
  const samples = [];
  const frame = () => {
    if (token !== pairListen.token || !pairListen.on) return;
    analyser.getFloatTimeDomainData(pairListen.buf);
    const heard = hearFlute(pairListen.buf, ctx.sampleRate);
    const t = ctx.currentTime - origin;
    if (t >= 0) samples.push({ t, hz: heard.hz, rms: heard.rms });
    const box = document.getElementById("pairVerdict");
    if (t < 0 && box) box.textContent = "Đếm chậm. Vào nốt đầu lúc đập.";
    if (ctx.currentTime < origin + 4 * beat) {
      pairListen.raf = requestAnimationFrame(frame);
      return;
    }
    stopPairListen();
    const first = samples.filter((s) => s.t < 2 * beat && s.hz > 0);
    const second = samples.filter((s) => s.t >= 2 * beat && s.hz > 0);
    const mid = samples.filter((s) => s.t >= 1.7 * beat && s.t <= 2.3 * beat);
    const aOk = first.length >= 3 && flutePitchOk(median(first.map((s) => s.hz)), notes[0].midi);
    const bOk = second.length >= 3 && flutePitchOk(median(second.map((s) => s.hz)), notes[1].midi);
    const linked = mid.some((s) => s.rms >= 0.01 || s.hz > 0);
    const host = document.getElementById("scoreHost");
    if (host) {
      host.querySelectorAll(".note").forEach((el, i) => {
        el.classList.remove("mark-bad", "mark-empty", "mark-good");
        const good = i === 0 ? aOk : bOk;
        const heardSome = (i === 0 ? first : second).length >= 3;
        if (!heardSome) el.classList.add("mark-empty");
        else if (!good) el.classList.add("mark-bad");
      });
    }
    if (box) {
      if (aOk && bOk && linked) box.textContent = "Đạt. Hơi liền, ngón đã đổi.";
      else if (!linked) box.textContent = "Hơi bị đứt giữa hai nốt. Giữ hơi, chỉ đổi ngón.";
      else box.textContent = (aOk ? "" : "Nốt đầu chưa đúng. ") + (bOk ? "" : "Nốt sau chưa đúng.");
    }
  };
  pairListen.raf = requestAnimationFrame(frame);
}

function barsOk(seq) {
  let e = 0;
  for (let i = 0; i < seq.length; i++) {
    const dur = seq[i][1];
    if (e % 8 + dur > 8) return false;
    e += dur;
  }

}
function mixLine() {
  const scale = ["C4", "D4", "E4", "F4", "G4", "A4"];
  const durs = [1, 2, 2, 2, 4, 4, 3, 6, 8];
  const kinds = ["up", "down", "leap", "turn", "wave"];
  const contour = kinds[Math.floor(Math.random() * kinds.length)];
  let idx = Math.floor(Math.random() * scale.length);
  let dir = Math.random() < 0.5 ? 1 : -1;
  const seq = [];
  let barLeft = 8;
  while (seq.length < 30) {
    const local = Math.random() < 0.45 ? kinds[Math.floor(Math.random() * kinds.length)] : contour;
    const choices = durs.filter((d) => d <= barLeft);
    let dur = choices.length ? choices[Math.floor(Math.random() * choices.length)] : barLeft;
    if (seq.length === 29) dur = barLeft;
    seq.push([scale[idx], dur]);
    let step = dir;
    if (local === "up") step = 1;
    else if (local === "down") step = -1;
    else if (local === "leap") step = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.floor(Math.random() * 3));
    else if (Math.random() < (local === "turn" ? 0.5 : 0.28)) step = (Math.random() < 0.5 ? -1 : 1) * (Math.random() < 0.3 ? 2 : 1);
    let next = idx + step;
    if (next < 0) next = Math.min(scale.length - 1, 1);
    if (next >= scale.length) next = Math.max(0, scale.length - 2);
    if (next === idx) next = (idx + 1) % scale.length;
    idx = next;
    if (local === "turn" || local === "wave") dir = -dir;
    barLeft -= dur;
    if (barLeft <= 0) barLeft = 8;
  }
  return seq;
}
function mixLively(seq) {
  const durs = {};
  seq.forEach((n) => { durs[n[1]] = 1; });
  if (Object.keys(durs).length < 2) return false;
  const scale = ["C4", "D4", "E4", "F4", "G4", "A4"];
  let leaps = 0;
  for (let i = 1; i < seq.length; i++) {
    if (Math.abs(scale.indexOf(seq[i][0]) - scale.indexOf(seq[i - 1][0])) >= 2) leaps++;
  }
  return leaps >= 2;
}

}

// Ghép theo thứ tự bằng quy hoạch động, cho phép bỏ sót hoặc gõ thừa.
function matchTiming(targets,taps,windowSeconds) {
  const n=targets.length,m=taps.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(Infinity)),prev=Array.from({length:n+1},()=>Array(m+1));
  dp[0][0]=0;
  for(let i=0;i<=n;i++) for(let j=0;j<=m;j++) {
    const put=(a,b,c,type)=>{if(c<dp[a][b]){dp[a][b]=c;prev[a][b]=type;}};
    if(i<n) put(i+1,j,dp[i][j]+1,'miss');
    if(j<m) put(i,j+1,dp[i][j]+1,'extra');
    if(i<n&&j<m&&Math.abs(targets[i]-taps[j])<=windowSeconds) put(i+1,j+1,dp[i][j]+Math.abs(targets[i]-taps[j])/windowSeconds,'hit');
  }
  let i=n,j=m,extra=0;const rows=[];
  while(i||j){const p=prev[i][j];if(p==='hit'){rows.push({index:i-1,delta:(taps[j-1]-targets[i-1])*1000});i--;j--;}else if(p==='miss'){rows.push({index:--i,delta:null});}else{j--;extra++;}}
  return {rows:rows.reverse(),extra};
}
function finishTiming(r) {
  const tolerance=Math.min(.09,r.beat*.15), result=matchTiming(r.targets,r.taps,Math.min(.2,r.beat*.3));
  const good=result.rows.filter(x=>x.delta!==null&&Math.abs(x.delta)<=tolerance*1000).length;
  const missed=result.rows.filter(x=>x.delta===null).length;
  const score=Math.round(100*good/(r.targets.length+result.extra));
  document.getElementById('timingLive').textContent=`${score}% vào nốt đúng · ${good}/${r.targets.length} · thiếu ${missed} · thừa ${result.extra}. Ngưỡng đúng ±${Math.round(tolerance*1000)} ms.`;
  document.getElementById('timingPad').textContent='Chạm để gõ · hoặc phím cách';
  document.getElementById('timingResult').innerHTML=`<table><thead><tr><th>Lần vào nốt</th><th>Kết quả</th></tr></thead><tbody>${result.rows.map(x=>`<tr><td>${x.index+1}</td><td>${x.delta===null?'Bỏ sót':Math.abs(x.delta)<=tolerance*1000?'Đúng nhịp':(x.delta<0?'Sớm ':'Muộn ')+Math.round(Math.abs(x.delta))+' ms'}</td></tr>`).join('')}</tbody></table><p>${score>=80?'Giữ kết quả này trong 3 lượt rồi hãy tăng tốc.':'Giảm 5–10 BPM, đếm cả tiếng “và”, nghe mẫu rồi thử lại.'}</p>`;
  const history=timingHistory();history.push({date:new Date().toLocaleString('vi-VN'),name:r.name,bpm:r.bpm,score,missed,extra:result.extra});
  try{localStorage.setItem('hoc-sao-timing-v1',JSON.stringify(history.slice(-20)));}catch(_){}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden && timing.run) {stopTiming();const el=document.getElementById('timingLive');if(el)el.textContent='Đã dừng khi rời màn hình. Bấm Tập gõ để bắt đầu lại.';}});

  { id: 'same', title: '1 · Giống hay khác?', hint: 'Nghe hai âm, trả lời giống hoặc khác. Mức dễ dùng Đô và Son cách xa nhau; mức khó mới dùng các nốt gần nhau.' },

function readEarSettings() {
  try { const x=JSON.parse(localStorage.getItem('hoc-sao-ear-settings-v1'));return x && typeof x==='object' ? x : {}; } catch (_) {return {};}
}
const earSaved=readEarSettings();
const ear={sound: earSaved.sound === "synth" ? "synth" : "bamboo",lesson:EAR_LESSONS.some(l=>l.id===earSaved.lesson)?earSaved.lesson:'same',level:[1,2,3].includes(earSaved.level)?earSaved.level:1,session:null,token:0,timer:0,playing:false,message:''};
function saveEarSettings(){try{localStorage.setItem('hoc-sao-ear-settings-v1',JSON.stringify({lesson:ear.lesson,level:ear.level,sound:ear.sound}));}catch(_){}}
function earHistory(){try{const x=JSON.parse(localStorage.getItem('hoc-sao-ear-history-v1'));return Array.isArray(x)?x.slice(-20):[];}catch(_){return [];}}
function earName(midi){const n=NOTES.find(n=>n.midi===midi);return n?n.name:'Đô';}
function makeEarSession(lesson,level){
  const pools={1:[60,67],2:[60,64,67],3:[60,62,64,65,67,69,71]};
  const pool=pools[level], questions=[];
  // Cân bằng các đáp án nhị phân để không thể thắng bằng chọn một nút suốt lượt.
  const binary=shuffle([true,true,true,true,true,false,false,false,false,false]);
  const namePool=level===1?[62,67]:level===2?[62,64,67]:[60,62,64,65,67,69,71];
  let names=[];while(names.length<10)names.push(...shuffle(namePool));
  for(let i=0;i<10;i++){
    let seq,answer,options;
    if(lesson==='same'){
      const a=pool[Math.floor(Math.random()*pool.length)];
      const neighbors=pool.filter((n,j)=>Math.abs(j-pool.indexOf(a))===1);
      const other=shuffle(level===3?neighbors:pool.filter(n=>n!==a))[0];seq=[a,binary[i]?a:other];answer=binary[i]?'same':'different';
      options=[['same','Giống nhau'],['different','Khác nhau']];
    }else if(lesson==='direction'){
      let a,b;
      if(level===1){a=60;b=67;}else if(level===3){const j=Math.floor(Math.random()*(pool.length-1));a=pool[j];b=pool[j+1];}
      else{const pair=shuffle(pool).slice(0,2).sort((a,b)=>a-b);[a,b]=pair;}
      seq=binary[i]?[a,b]:[b,a];answer=binary[i]?'up':'down';options=[['up','Đi lên'],['down','Đi xuống']];
    }else if(lesson==='name'){
      seq=[60,names[i]];answer=String(names[i]);options=namePool.map(n=>[String(n),earName(n)]);
    }else{
      seq=Array.from({length:level},()=>pool[Math.floor(Math.random()*pool.length)]);answer='';options=[];
    }
    questions.push({seq,answer,options,heard:false,answered:false,revealed:false,choice:null});
  }
  return {lesson,level,questions,index:0,good:0,saved:false};
}
function paintEar(){
  if(!ear.session)ear.session=makeEarSession(ear.lesson,ear.level);
  const session=ear.session, lesson=EAR_LESSONS.find(l=>l.id===ear.lesson), q=session.questions[session.index];
  const top=`<div class="card"><h2>Luyện tai · 10 phút mỗi ngày</h2>${soundControls()}<p>Mỗi lượt 10 câu, nghe lại không giới hạn. Đạt ít nhất 8/10 trong 3 lượt rồi hãy tăng mức.</p>
    <div class="row">${EAR_LESSONS.map(l=>`<button class="btn ${l.id===ear.lesson?'primary':''}" data-act="ear-lesson" data-lesson="${l.id}">${l.title}</button>`).join('')}</div>
    <div class="row">${[1,2,3].map(n=>`<button class="btn ${n===ear.level?'primary':''}" data-act="ear-level" data-level="${n}">${n===1?'Dễ':n===2?'Vừa':'Khó hơn'}</button>`).join('')}</div><p>${lesson.hint}</p></div>`;
  if(!q){
    if(!session.saved && ear.lesson!=='echo'){
      const h=earHistory();h.push({lesson:ear.lesson,level:ear.level,good:session.good,total:10,date:new Date().toLocaleString('vi-VN')});
      try{localStorage.setItem('hoc-sao-ear-history-v1',JSON.stringify(h.slice(-20)));}catch(_){}session.saved=true;
    }
    const latest=earHistory().filter(h=>h.lesson===ear.lesson&&h.level===ear.level).slice(-3);
    return `<section class="ear-page">${top}<div class="card"><h3>${ear.lesson==='echo'?'Đã thực hành 10 mẫu':session.good+'/10 câu đúng'}</h3><p>${ear.lesson==='echo'?'Tiếp tục nghe và thổi đối chiếu; bài này không tính điểm nhận diện.':latest.length===3&&latest.every(h=>h.good>=8)?'Ba lượt gần đây đều đạt ít nhất 8/10. Bạn có thể thử mức tiếp theo.':'Nghe lại chậm rãi, tập cùng mức đến khi chắc rồi mới tăng độ khó.'}</p><button class="btn primary" data-act="ear-new">Làm lượt mới</button></div>${paintEarHistory()}</section>`;
  }
  const revealed=q.answered||q.revealed;
  const explanation=ear.lesson==='same'?(q.answer==='same'?'Hai âm cùng cao độ.':'Hai âm khác cao độ.'):ear.lesson==='direction'?(q.answer==='up'?'Âm thứ hai cao hơn.':'Âm thứ hai thấp hơn.'):ear.lesson==='name'?'Âm đầu là Đô làm mốc. Âm cần đoán là '+earName(q.seq[1])+'.':'Thổi lần lượt: '+q.seq.map(earName).join(' → ')+'.';
  return `<section class="ear-page">${top}<div class="card">
    <p>Câu ${session.index+1}/10${ear.lesson!=='echo'?' · đúng '+session.good:''}</p>
    <button class="btn primary ear-listen" data-act="ear-play">${q.heard?'Nghe lại câu này':'Nghe câu hỏi'}</button>
    ${ear.lesson==='name'||ear.lesson==='echo'?'<button class="btn" data-act="ear-reference">Nghe Đô làm mốc</button>':''}
    <p id="earAudioStatus" role="status" aria-live="polite">${q.heard?'Đã nghe. Bạn có thể trả lời hoặc nghe lại.':'Bấm Nghe câu hỏi trước. Âm mẫu vẫn phát khi tắt tùy chọn “Nghe tiếng nốt”.'}</p>
    ${ear.lesson!=='echo'?`<div class="ear-options">${q.options.map(([value,label])=>`<button class="btn ${revealed&&value===q.answer?'primary':''}" data-act="ear-answer" data-answer="${value}" ${!q.heard||q.answered?'disabled':''}>${esc(label)}</button>`).join('')}</div>`:`<p>Nghe → ngân nga → thổi lại. ${ear.level} nốt trong cùng quãng 1 của sáo Đô.</p><button class="btn" data-act="ear-reveal" ${!q.heard||q.revealed?'disabled':''}>Hiện đáp án để đối chiếu</button><button class="btn primary" data-act="ear-coach" ${!q.heard?'disabled':''}>Thổi lại có micro kiểm tra</button>`}
    <div class="ear-feedback" role="status">${revealed?`<p><strong>${ear.lesson==='echo'?'Đối chiếu':q.choice===q.answer?'Đúng.':'Chưa đúng.'}</strong> ${explanation}</p><p>${ear.lesson!=='echo'?'Trình tự vừa nghe: '+q.seq.map(earName).join(' → ')+'.':''}</p>`:''}</div>
    ${revealed?`<button class="btn primary" data-act="${ear.lesson==='echo'?'ear-echo-next':'ear-next'}">${session.index===9?'Xem kết quả':'Câu tiếp theo'}</button>`:''}
    <p class="foot-note">Âm mẫu theo bộ tiếng bạn chọn, ở cao độ sáo Đô. Tập nhỏ vừa nghe; dừng trước khi thổi để âm mẫu không lẫn với tiếng sáo của bạn.</p>
  </div>${paintEarHistory()}<p class="foot-note">Kết quả lưu trên trình duyệt này. Bài nghe có mốc để luyện tai tương đối; không đánh giá khả năng nghe tên nốt tuyệt đối.</p></section>`;
}
function paintEarHistory(){
  const rows=earHistory().slice(-5).reverse();
  return `<div class="card"><h3>Lượt luyện gần đây</h3>${rows.length?`<ul>${rows.map(h=>`<li>${esc(EAR_LESSONS.find(l=>l.id===h.lesson)?.title||'Luyện tai')} · mức ${h.level} · ${h.good}/${h.total} · ${esc(h.date)}</li>`).join('')}</ul>`:'<p>Chưa có kết quả. Mỗi lượt có 10 câu, không giới hạn số lần nghe lại.</p>'}</div>`;
}
function stopEarAudio(){ear.token++;clearTimeout(ear.timer);ear.playing=false;}
function syncEarAudioUI(message){
  const el=document.getElementById('earAudioStatus')||document.getElementById('coachLive');if(el)el.textContent=message;
  const q=ear.session?.questions[ear.session.index];
  document.querySelectorAll('[data-act="ear-answer"],[data-act="ear-reveal"]').forEach(b=>{b.disabled=ear.playing||!q?.heard||q.answered||(b.dataset.act==='ear-reveal'&&q.revealed);});
}
async function playEarSequence(seq,onEnd){
  stopEarAudio();engine.stop();
  const token=ear.token;ear.playing=true;syncEarAudioUI('Đang phát, hãy nghe hết rồi trả lời…');
  try{
    const ctx=await engine.ac();
    if(token!==ear.token||state.tab!=='practice'||!['ear','coach'].includes(state.practice))return;
    if(!ctx||ctx.state!=='running')throw Error('audio unavailable');
    const start=ctx.currentTime+.08,spacing=1.05,duration=.65;
    if (ear.sound === 'bamboo') {
      const sample = await loadBamboo(ctx);
      if(token!==ear.token)return;
      const at=ctx.currentTime+.08; seq.forEach((n,i)=>sampleTone(ctx,sample,at+i*spacing,n+12,duration));
    } else seq.forEach((n,i)=>tone(ctx,start+i*spacing,n+12,duration,false,''));
    ear.timer=setTimeout(()=>{
      if(token!==ear.token)return;
      ear.playing=false;if(onEnd)onEnd();syncEarAudioUI('Đã phát xong. Bạn có thể trả lời hoặc nghe lại.');
    },(.08+(seq.length-1)*spacing+duration+.06)*1000);
  }catch(_){if(token===ear.token){ear.playing=false;syncEarAudioUI('Không phát được âm thanh. Kiểm tra âm lượng, chế độ im lặng rồi bấm nghe lại.');}}
}
function playEarQuestion(){
  const q=ear.session?.questions[ear.session.index];if(!q)return;
  playEarSequence(q.seq,()=>{q.heard=true;});
}
function answerEar(value){
  const q=ear.session?.questions[ear.session.index];
  if(!q||!q.heard||q.answered||ear.playing||!q.options.some(o=>o[0]===value))return;
  q.choice=value;q.answered=true;if(value===q.answer)ear.session.good++;
  paint();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden && ear.playing){stopEarAudio();engine.stop();syncEarAudioUI('Đã dừng khi rời màn hình. Bấm Nghe câu hỏi để nghe trọn câu.');}

// Bản thu CC0: PanPiper5, Low Bamboo Flute, Freesound 659915.
// Cắt đoạn, chuyển cao độ bằng Rubber Band, chuẩn hóa âm lượng; gốc sau xử lý ~523.804 Hz.
let bambooBuffer=null;
async function loadBamboo(ctx){
  if(!bambooBuffer){const r=await fetch(BAMBOO_WAV);bambooBuffer=await ctx.decodeAudioData(await r.arrayBuffer());}
  return bambooBuffer;
}
function sampleTone(ctx,buffer,time,midi,duration){
  const src=ctx.createBufferSource(),gain=ctx.createGain();src.buffer=buffer;
  const rate=(440*Math.pow(2,(midi-69)/12))/523.8041053;src.playbackRate.value=rate;
  const length=Math.min(duration,(buffer.duration-.04)/rate);
  gain.gain.setValueAtTime(.001,time);gain.gain.linearRampToValueAtTime(.65,time+.02);gain.gain.setValueAtTime(.65,Math.max(time+.02,time+length-.06));gain.gain.linearRampToValueAtTime(.001,time+length);
  src.connect(gain);gain.connect(ctx.destination);src.start(time,.02,length*rate);src.stop(time+length+.01);engine.nodes.push(src);
  src.onended=()=>{src.disconnect();gain.disconnect();};
}

const COACH_PAIRS=[[60,62],[62,64],[64,67],[67,69],[69,67],[67,64],[64,62],[62,60]];

function paintCoach(){

function stopCoach(){
  coach.token++;cancelAnimationFrame(coach.raf);coach.raf=0;
  if(coach.stream)coach.stream.getTracks().forEach(t=>t.stop());coach.stream=null;
  try{coach.source?.disconnect();}catch(_){}coach.source=null;coach.analyser=null;coach.run=null;
}
function pitchCents(hz,midi){return hz>0?1200*Math.log2(hz/(440*Math.pow(2,(midi-69)/12))):null;}
function longestQuiet(samples,from,to){
  let begin=null,longest=0;
  for(const s of samples.filter(s=>s.t>=from&&s.t<=to)){
    if(s.rms<.008){if(begin===null)begin=s.t;longest=Math.max(longest,s.t-begin);}else begin=null;
  }return longest;
}
function gradePairSamples(samples,seq){
  const rows=seq.map((n,i)=>{
    const body=samples.filter(s=>s.t>=i*2+.2&&s.t<(i+1)*2-.2), voiced=body.filter(s=>s.hz>0);
    const good=voiced.filter(s=>Math.abs(pitchCents(s.hz,n+12))<=50);
    return {name:earName(n),coverage:body.length?Math.round(100*good.length/body.length):0,cents:voiced.length?Math.round(median(voiced.map(s=>pitchCents(s.hz,n+12)))):null};
  });
  const gap=longestQuiet(samples,1.65,2.35);
  return {rows,gapMs:Math.round(gap*1000),linked:gap<.1&&samples.filter(s=>s.t>1.65&&s.t<2.35&&s.hz>0).length>=3};
}
async function startCoach(){
  if(!coach.heard)return;
  stopCoach();stopEarAudio();engine.stop();releaseMic();stopLineListen();stopPairListen();stopBreathListen();stopQuizListen();stopFingerListen();
  const token=coach.token,seq=coachSequence().slice(),kind=coach.kind;
  const live=()=>document.getElementById('coachLive');
  if(live())live().textContent='Đang xin quyền micro…';
  try{
    const ctx=await engine.ac();
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('Micro cần HTTPS và trình duyệt hỗ trợ.');
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    if(token!==coach.token||state.practice!=='coach'||state.tab!=='practice'){stream.getTracks().forEach(t=>t.stop());return;}
    coach.stream=stream;coach.source=ctx.createMediaStreamSource(stream);const analyser=ctx.createAnalyser();analyser.fftSize=2048;coach.source.connect(analyser);coach.analyser=analyser;
    const buf=new Float32Array(2048),origin=ctx.currentTime+.8,samples=[];
    const run={kind,seq,index:0,heldSince:null,awaitRelease:false,deadline:origin+8,successes:[],last:0};coach.run=run;
    function finish(html){if(token!==coach.token)return;coach.report=html;const box=document.getElementById('coachResult');if(box)box.innerHTML=html;if(live())live().textContent='Đã kết thúc, micro đã tắt. Có thể nghe mẫu rồi thử lại.';stopCoach();}
    function frame(){
      if(token!==coach.token)return;
      const now=ctx.currentTime,t=now-origin;
      if(now-run.last<.04){coach.raf=requestAnimationFrame(frame);return;}run.last=now;
      if(t<0){if(live())live().textContent='Chuẩn bị… mẫu đã dừng, bắt đầu thổi khi hiện tên nốt.';coach.raf=requestAnimationFrame(frame);return;}
      analyser.getFloatTimeDomainData(buf);const heard=yinPitch(buf,ctx.sampleRate);samples.push({t,hz:heard.hz,rms:heard.rms});
      const index=kind==='pair'?Math.min(1,Math.floor(t/2)):run.index,target=seq[index]+12,cents=pitchCents(heard.hz,target);
      if(run.awaitRelease && heard.rms<.008)run.awaitRelease=false;
      const right=cents!==null&&Math.abs(cents)<=50&&!run.awaitRelease;
      if(live())live().textContent=`${run.awaitRelease?'Nhả tiếng rồi thổi lại':kind==='pair'?'Giữ':'Thổi'} ${earName(seq[index])} · ${heard.hz?(right?'đúng cao độ':Math.abs(cents)>600?'khác nốt hoặc khác quãng':cents>0?'đang cao':'đang thấp')+' ('+Math.round(cents)+' cent)':'chưa nghe rõ nốt'}${kind==='pair'?' · '+Math.max(0,(2-t%2)).toFixed(1)+' giây':''}`;
      if(kind==='echo'){
        if(right){if(run.heldSince===null)run.heldSince=now;if(now-run.heldSince>=.4){run.successes.push({name:earName(seq[index]),cents:Math.round(cents)});run.index++;run.awaitRelease=seq[run.index]===seq[run.index-1];run.heldSince=null;run.deadline=now+8;if(run.index===seq.length){finish('<p class="ok">Đã thổi đúng '+seq.length+' nốt và đúng quãng.</p><p>'+run.successes.map(x=>esc(x.name)+': '+x.cents+' cent').join(' · ')+'</p>');return;}}}else run.heldSince=null;
        if(now>run.deadline){finish('<p>Chưa hoàn thành: đúng '+run.index+'/'+seq.length+' nốt. Nghe mẫu lại, tập từng nốt và kiểm tra sáo Đô C5.</p>');return;}
      }else if(t>=4){
        const grade=gradePairSamples(samples,seq);finish('<p>'+grade.rows.map(x=>esc(x.name)+': '+x.coverage+'% thời gian đúng cao độ'+(x.cents===null?' (chưa rõ nốt)':' · lệch giữa đoạn '+x.cents+' cent')).join('<br>')+'</p><p>Khoảng im lặng dài nhất gần chỗ đổi: '+grade.gapMs+' ms. '+(grade.linked?'Chưa thấy khoảng ngắt rõ trên 100 ms.':'Có khoảng ngắt hoặc chưa đủ tín hiệu để xác nhận liền tiếng. Tập chậm, giữ hơi và đổi ngón gọn.')+'</p>');return;
      }
      coach.raf=requestAnimationFrame(frame);
    }coach.raf=requestAnimationFrame(frame);
  }catch(err){if(token!==coach.token)return;stopCoach();if(live())live().textContent=err.name==='NotAllowedError'?'Micro bị từ chối. Cho phép micro trong cài đặt trang rồi thử lại.':'Không mở được micro. Kiểm tra thiết bị và dùng HTTPS rồi thử lại.';}
}
function phraseEvents(samples){
  const events=[];let active=null,quietSince=null,base=0,lastOn=-1;
  for(const s of samples){
    const midi=s.hz>0?Math.round(69+12*Math.log2(s.hz/440)):null;
    const onset=s.rms>.02&&s.rms>base*1.7&&s.rms-base>.012&&s.t-lastOn>.09;base=.55*s.rms+.45*base;
    if(midi!==null){
      if(!active||midi!==active.midi||onset){if(active){active.end=s.t;events.push(active);}active={start:s.t,end:s.t,midi};if(onset)lastOn=s.t;}
      else active.end=s.t;
      quietSince=null;
    }else if(active){if(quietSince===null)quietSince=s.t;if(s.t-quietSince>.06){active.end=quietSince;events.push(active);active=null;}}
  }
  if(active)events.push(active);
  return events.filter(e=>e.end-e.start>=.06);
}
function measurePhrase(notes,from,to,samples,beat,latency=0){
  const items=layout(notes).items.filter(n=>n.start>=from&&n.start<to);
  const events=phraseEvents(samples).map(e=>({...e,start:e.start-latency,end:e.end-latency}));
  const targets=items.map(n=>(n.start-from)/2*beat),match=matchTiming(targets,events.map(e=>e.start),Math.min(.35,beat*.6));
  // Use matched timestamps to locate each acoustic event without reusing it.
  const used=new Set();let good=0;
  const rows=match.rows.map(r=>{
    const n=items[r.index],dur=n.e/2*beat;
    if(r.delta===null)return {name:n.name,startMs:null,durationMs:null};
    const actual=targets[r.index]+r.delta/1000;
    const k=events.findIndex((e,i)=>!used.has(i)&&Math.abs(e.start-actual)<.00001);used.add(k);const e=events[k];
    const startMs=Math.round(r.delta),durationMs=e?Math.round(((e.end-e.start)-dur)*1000):null;
    if(Math.abs(startMs)<=100)good++;
    return {name:n.name,startMs,durationMs,slur:n.art==='luyen'};
  });
  return {rows,extra:match.extra,score:Math.round(100*good/Math.max(1,items.length+match.extra))};
}
function phraseReport(m){
  if(!m)return '';
  return `<div class="phrase-results"><p><strong>Nhịp vào nốt: ${m.score}%</strong> · âm phát thêm: ${m.extra}. Ngưỡng tham khảo ±100 ms.</p><table><thead><tr><th>Nốt</th><th>Vào nốt</th><th>Độ ngân ước lượng</th></tr></thead><tbody>${m.rows.map(r=>`<tr><td>${esc(r.name)}${r.slur?' (luyến)':''}</td><td>${r.startMs===null?'Chưa ghép được':Math.abs(r.startMs)<=100?'Trong ngưỡng':(r.startMs<0?'Sớm ':'Muộn ')+Math.abs(r.startMs)+' ms'}</td><td>${r.durationMs===null?'Chưa đo được':Math.abs(r.durationMs)<=120?'Gần đủ':(r.durationMs<0?'Thiếu ':'Dư ')+Math.abs(r.durationMs)+' ms'}</td></tr>`).join('')}</tbody></table></div>`;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopCoach();clearTimeout(lineListen.repeatTimer);if(lineListen.on)stopLineListen();}});

function init() {
  remixPiece();
  audit();
  document.getElementById("bpm").value = String(state.bpm);
  document.getElementById("bpmVal").textContent = state.bpm;
  document.getElementById("sw-metro").checked = state.metro;
  document.getElementById("sw-voice").checked = state.voice;
  document.getElementById("sw-hint").checked = state.hint;
  document.getElementById("sw-extra").checked = state.extras;
  document.body.addEventListener("click", onClick);
  document.body.addEventListener("pointerdown", onPointer);
  document.body.addEventListener("input", onInput);
  document.body.addEventListener("change", onChange);
  document.addEventListener("keydown", onKey);
  paint();
}
init();
